<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Maze Explorer - Web Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 100;
            text-shadow: 1px 1px 2px black;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="info">🏆 3D MAZE EXPLORER • Find the golden cube to win!</div>
    <div id="controls">🖱️ Click to play • WASD to move • Mouse to look • Find the gold cube!</div>
    <div id="crosshair"></div>

    <!-- Import Three.js and PointerLockControls from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- SETUP SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaaccff); // Sky blue
        scene.fog = new THREE.Fog(0xaaccff, 10, 30); // Add fog for atmosphere

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Enable shadows for realism
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Softer shadows
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING (Realistic setup) ---
        // Ambient light for base illumination
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Main directional light (sun)
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(10, 20, 5);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        const d = 15;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 30;
        scene.add(sunLight);

        // Fill light from opposite side
        const fillLight = new THREE.DirectionalLight(0x4466ff, 0.3);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);

        // Soft rim light
        const rimLight = new THREE.DirectionalLight(0xffccaa, 0.5);
        rimLight.position.set(-5, 5, 15);
        scene.add(rimLight);

        // Add a few point lights for atmosphere inside maze
        const pointLight1 = new THREE.PointLight(0xffaa00, 0.5, 15);
        pointLight1.position.set(8, 3, 8);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0x44aaff, 0.5, 15);
        pointLight2.position.set(12, 2, 3);
        scene.add(pointLight2);

        // --- GROUND (with texture-like appearance) ---
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x3d5d3d,
            roughness: 0.7,
            metalness: 0.1,
            emissive: new THREE.Color(0x000000)
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        // Add a grid helper for visual reference (optional, but looks cool)
        const gridHelper = new THREE.GridHelper(30, 20, 0x88aa88, 0x335533);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // --- CREATE MAZE WALLS ---
        function createWall(x, y, z, width, height, depth, color = 0x8B6B4D) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({ 
                color: color,
                roughness: 0.4,
                metalness: 0.1,
                emissive: new THREE.Color(0x000000)
            });
            const wall = new THREE.Mesh(geometry, material);
            wall.position.set(x, y, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            return wall;
        }

        // Maze layout (walls as boxes)
        // Outer walls
        scene.add(createWall(0, 1.5, -7, 20, 3, 0.5)); // north wall
        scene.add(createWall(0, 1.5, 7, 20, 3, 0.5)); // south wall
        scene.add(createWall(-10, 1.5, 0, 0.5, 3, 14)); // west wall
        scene.add(createWall(10, 1.5, 0, 0.5, 3, 14)); // east wall

        // Interior walls (making a simple maze)
        scene.add(createWall(-5, 1.5, -3, 0.5, 3, 6, 0xA0522D));
        scene.add(createWall(0, 1.5, -2, 6, 3, 0.5, 0xA0522D));
        scene.add(createWall(5, 1.5, 1, 0.5, 3, 8, 0xA0522D));
        scene.add(createWall(-2, 1.5, 4, 6, 3, 0.5, 0xA0522D));
        scene.add(createWall(-6, 1.5, 2, 0.5, 3, 5, 0xA0522D));
        scene.add(createWall(3, 1.5, -4, 4, 3, 0.5, 0xA0522D));
        scene.add(createWall(7, 1.5, -2, 0.5, 3, 5, 0xA0522D));

        // Add some pillars for decoration
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xAAAAAA, roughness: 0.2, metalness: 0.3 });
        const pillarPositions = [[-8, 1, -5], [8, 1, 5], [-8, 1, 5], [8, 1, -5], [-3, 1, -6], [4, 1, 6]];
        pillarPositions.forEach(pos => {
            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2, 16), pillarMat);
            pillar.position.set(pos[0], pos[1], pos[2]);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        });

        // --- ADD SOME DECORATIVE OBJECTS (trees/rocks) for realism ---
        function createTree(x, z) {
            const group = new THREE.Group();
            
            // Trunk
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.7 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 1.5, 8), trunkMat);
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            group.add(trunk);
            
            // Leaves
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2E7D32, roughness: 0.4, emissive: new THREE.Color(0x112211) });
            const leaf1 = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.8, 8), leafMat);
            leaf1.position.y = 1.5;
            leaf1.castShadow = true;
            leaf1.receiveShadow = true;
            group.add(leaf1);
            
            const leaf2 = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.7, 8), leafMat);
            leaf2.position.y = 2.1;
            leaf2.castShadow = true;
            leaf2.receiveShadow = true;
            group.add(leaf2);
            
            group.position.set(x, 0, z);
            return group;
        }

        scene.add(createTree(-6, -5));
        scene.add(createTree(7, 6));
        scene.add(createTree(-7, 6));
        scene.add(createTree(6, -6));

        // Add some rocks
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });
        const rockPos = [[-4, 0.1, 5], [5, 0.1, -4], [-5, 0.1, -4], [3, 0.1, 3]];
        rockPos.forEach(pos => {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3), rockMat);
            rock.position.set(pos[0], pos[1], pos[2]);
            rock.castShadow = true;
            rock.receiveShadow = true;
            scene.add(rock);
        });

        // --- THE GOAL: A GOLDEN CUBE ---
        const goalMat = new THREE.MeshStandardMaterial({ 
            color: 0xFFD700,
            emissive: new THREE.Color(0x443300),
            roughness: 0.2,
            metalness: 0.8
        });
        const goalCube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), goalMat);
        goalCube.position.set(8, 0.5, 6); // Hidden in a corner
        goalCube.castShadow = true;
        goalCube.receiveShadow = true;
        scene.add(goalCube);

        // Add a floating particle effect around the goal
        const particleCount = 20;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 3 + goalCube.position.x;
            particlePositions[i*3+1] = Math.random() * 3;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 3 + goalCube.position.z;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.1, transparent: true });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- CONTROLS ---
        const controls = new PointerLockControls(camera, document.body);
        
        // Click to lock pointer
        document.addEventListener('click', () => {
            controls.lock();
        });

        // Add UI feedback
        controls.addEventListener('lock', () => {
            document.getElementById('controls').style.opacity = '0.3';
        });
        
        controls.addEventListener('unlock', () => {
            document.getElementById('controls').style.opacity = '1';
        });

        scene.add(controls.getObject());

        // --- MOVEMENT STATE ---
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false
        };

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': moveState.forward = true; break;
                case 'KeyS': moveState.backward = true; break;
                case 'KeyA': moveState.left = true; break;
                case 'KeyD': moveState.right = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': moveState.forward = false; break;
                case 'KeyS': moveState.backward = false; break;
                case 'KeyA': moveState.left = false; break;
                case 'KeyD': moveState.right = false; break;
            }
        });

        // --- COLLISION DETECTION (simple) ---
        function checkCollision(position) {
            // Define wall boundaries (simplified - in real game you'd check each wall)
            // This is a basic boundary check to keep player in play area
            if (position.x < -9) position.x = -9;
            if (position.x > 9) position.x = 9;
            if (position.z < -6) position.z = -6;
            if (position.z > 6) position.z = 6;
            
            // Check goal proximity
            const distToGoal = position.distanceTo(goalCube.position);
            if (distToGoal < 1.5) {
                alert('🎉 YOU FOUND THE GOLDEN CUBE! YOU WIN!');
                // Reset position
                position.set(2, 2, 5);
            }
            
            return position;
        }

        // --- GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const speed = 5 * delta;

            // Move camera based on state
            if (controls.isLocked) {
                const cameraPos = camera.position.clone();
                
                if (moveState.forward) {
                    controls.moveForward(speed);
                }
                if (moveState.backward) {
                    controls.moveForward(-speed);
                }
                if (moveState.left) {
                    controls.moveRight(-speed);
                }
                if (moveState.right) {
                    controls.moveRight(speed);
                }
                
                // Simple collision
                camera.position.copy(checkCollision(camera.position));
            }

            // Rotate particles around goal
            particles.rotation.y += 0.01;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // --- HANDLE WINDOW RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- ADD SOME STARS IN THE SKY (for fun) ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 200;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            starsPos[i*3] = (Math.random() - 0.5) * 200;
            starsPos[i*3+1] = (Math.random() - 0.5) * 200;
            starsPos[i*3+2] = (Math.random() - 0.5) * 200 - 50; // behind the sky
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        console.log('Game ready! Click to play.');
    </script>
</body>
</html>
