<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Pro – Studio Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #fbbf24;
            --accent: #ec4899; /* Hot pink for "Special" elements */
            --bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; outline-color: var(--primary); }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            background: var(--bg); 
            color: white; 
            overflow: hidden; 
            user-select: none;
        }

        /* --- SIDEBAR --- */
        #sidebar { 
            width: 340px; 
            min-width: 340px; 
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(30px); 
            border-right: 1px solid var(--glass-border); 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            z-index: 10; 
        }
        
        .user-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { 
            background: var(--glass); 
            border: 1px solid var(--glass-border); 
            color: white; 
            padding: 6px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.75rem; 
            transition: 0.2s; 
        }
        .logout-btn:hover { background: var(--danger); border-color: var(--danger); }

        @keyframes pulseHint { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .hint-text { font-size: 0.75rem; text-align: center; margin-bottom: 12px; color: var(--warning); animation: pulseHint 2s infinite; font-weight: 600; }

        .score-box {
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        #streak-chip {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
        }

        #log-list { flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; margin-bottom: 20px; }
        .log-item { margin-bottom: 10px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-border); transition: 0.3s; }
        .log-item.open { border-color: var(--primary); background: rgba(99, 102, 241, 0.15); }
        .log-header { padding: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .log-answer { max-height: 0; padding: 0 14px; font-size: 0.8rem; background: rgba(0,0,0,0.2); transition: 0.3s; overflow: hidden; }
        .log-item.open .log-answer { max-height: 100px; padding: 14px; border-top: 1px solid var(--glass-border); }

        /* --- MAIN AREA & SCREENS --- */
        #game-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 40px; }
        
        .bar-wrapper { position: absolute; top: 0; left: 0; width: 100%; z-index: 100; }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.4); }
        #progress-bar-fill { width: 0%; height: 100%; background: var(--success); transition: width 0.4s ease; }
        #timer-container { width: 100%; height: 4px; background: rgba(255,255,255,0.05); display: none; }
        #timer-bar { width: 100%; height: 100%; background: var(--success); transition: width 0.1s linear; }

        .menu-card { 
            text-align: center; 
            background: white; 
            color: #1e293b; 
            padding: 40px; 
            border-radius: 32px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.5); 
            width: 450px; 
            display: none; 
            animation: slideUp 0.4s ease-out;
            max-height: 85vh;
            overflow-y: auto;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .btn-mode { 
            background: var(--primary); color: white; border: none; padding: 16px; border-radius: 14px; 
            margin: 8px 0; width: 100%; cursor: pointer; font-weight: 800; font-size: 1rem; transition: 0.2s; 
        }
        .btn-mode:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn-accent { background: var(--accent) !important; }

        /* --- CUSTOM DECK ARCHITECT --- */
        .architect-grid { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; text-align: left; }
        .architect-row { background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; position: relative; }
        .architect-row input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #cbd5e1; border-radius: 6px; }
        .remove-node { position: absolute; top: 10px; right: 10px; color: var(--danger); cursor: pointer; font-weight: bold; }
        
        .deck-pill { 
            background: #f1f5f9; padding: 10px; border-radius: 12px; margin-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 2px solid transparent;
        }
        .deck-pill:hover { border-color: var(--primary); }
        .deck-pill.selected { border-color: var(--accent); background: #fdf2f8; }

        /* --- CARD --- */
        .card { width: 480px; height: 320px; perspective: 1500px; cursor: pointer; margin-bottom: 30px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .front, .back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; align-items: center; justify-content: center; padding: 40px; 
            border-radius: 32px; font-size: 1.75rem; font-weight: 800; box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
        }
        .front { background: white; color: #1e293b; }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }

        /* Unique Glitch Animation for Custom Decks */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .custom-sync { animation: glitch 0.3s ease-in-out; }

        #settings-trigger { position: fixed; bottom: 20px; right: 20px; background: var(--glass); border: 1px solid var(--glass-border); color: white; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="user-row">
            <span id="user-display" style="font-weight: 800; color: var(--warning);">Guest</span>
            <button class="logout-btn" onclick="logout()">Logout ⏻</button>
        </div>
        <div class="hint-text">Click ✔ items to review</div>
        <div class="score-box">
            <div style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; opacity: 0.9;">Score</div>
            <span id="score-text" style="font-size: 2.2rem; font-weight:900;">0</span>
            <div id="streak-chip">Streak: 0 | Best: 0</div>
        </div>
        <ul id="log-list"></ul>
        <div id="leaderboard">
            <div style="font-weight: 900; font-size: 0.9rem; margin-bottom: 12px;">🏆 Leaderboard</div>
            <div id="lb-content"></div>
            <button class="reset-lb" onclick="resetLeaderboard()">Reset Records</button>
        </div>
    </aside>

    <main id="game-container">
        <div class="bar-wrapper">
            <div class="progress-bar-bg"><div id="progress-bar-fill"></div></div>
            <div id="timer-container"><div id="timer-bar"></div></div>
        </div>

        <div id="screen-profile" class="menu-card">
            <h1>Studio Entry</h1>
            <input type="text" id="nickname-input" placeholder="Your name..." maxlength="12">
            <button class="btn-mode" onclick="saveProfile()">Enter Studio</button>
        </div>

        <div id="screen-mode" class="menu-card">
            <h1>Studio Hub</h1>
            <p>Select your deck and challenge level</p>
            
            <div id="deck-selection-hub" style="margin-bottom: 20px; text-align: left;">
                <label style="font-weight: 800; font-size: 0.8rem; color: #64748b;">ACTIVE MEMORY DECK</label>
                <div id="deck-list-container" style="margin-top:10px;">
                    </div>
            </div>

            <button class="btn-mode" onclick="setMode('Normal')">Normal Mode</button>
            <button class="btn-mode" style="background: var(--warning); color: #000;" onclick="setMode('Speed')">⚡ Speed Blitz</button>
            <hr style="opacity: 0.1; margin: 20px 0;">
            <button class="btn-mode btn-accent" onclick="showArchitect()">Neural Architect (Custom Decks)</button>
        </div>

        <div id="screen-architect" class="menu-card">
            <h1>Neural Architect</h1>
            <p>Design your own custom memory nodes.</p>
            <input type="text" id="custom-deck-name" placeholder="Deck Name (e.g. Biology 101)" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
            
            <div id="architect-nodes" class="architect-grid">
                </div>

            <button class="btn-mode" onclick="addNode()">+ Add New Node</button>
            <button class="btn-mode btn-accent" onclick="saveCustomDeck()">Save to Memory</button>
            <button class="btn-back" onclick="showScreen('screen-mode')">Cancel</button>
        </div>

        <div id="screen-size" class="menu-card">
            <h1>Session Size</h1>
            <button class="btn-mode" onclick="startGame(10)">Sprint (10)</button>
            <button class="btn-mode" onclick="startGame(50)">Marathon (50)</button>
            <button class="btn-back" onclick="showScreen('screen-mode')">← Hub</button>
        </div>
                
        <div id="game-ui" style="display: none; flex-direction: column; align-items: center;">
            <div id="counter" style="margin-bottom: 20px; font-weight: 900; background: rgba(255,255,255,0.1); padding: 6px 18px; border-radius: 20px; font-size: 0.8rem;">CARD 1</div>
            <div class="card" id="card" onclick="this.classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="front" id="q-text"></div>
                    <div class="back" id="a-text"></div>
                </div>
            </div>
            <div class="btn-group" style="display:flex; gap:20px;">
                <button class="btn-mode" style="background:var(--danger); width:150px" onclick="handleAnswer(false)">❌ Miss</button>
                <button class="btn-mode" style="background:var(--success); width:150px" onclick="handleAnswer(true)">✅ Got It</button>
            </div>
        </div>

        <div id="screen-over" class="menu-card">
            <h1 id="over-title">Finished!</h1>
            <p id="final-stats" style="font-size: 1.4rem; font-weight: 800;"></p>
            <button id="retry-missed-btn" class="btn-mode" style="background: var(--danger);" onclick="replayMissed()">Review Mistakes</button>
            <button class="btn-mode" onclick="showScreen('screen-mode')">Menu</button>
        </div>
    </main>

    <button id="settings-trigger" onclick="alert('Settings: SFX Enabled | V-Sync Active')">⚙</button>

    <script>
        let audioCtx, currentDeck = [], missedCards = [], gameMode = 'Normal', 
            currentIndex = 0, score = 0, lock = false, timerInterval, 
            isReviewMode = false, userName = "", currentStreak = 0, bestStreak = 0;

        const defaultDeck = [
            { q: "What is the capital of Japan?", a: "Tokyo" },
            { q: "How many continents are there?", a: "7" },
            { q: "What is the square root of 144?", a: "12" },
            { q: "Which planet is closest to the sun?", a: "Mercury" },
            { q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" }
        ];

        let activeDeckData = [...defaultDeck];
        let customDecks = JSON.parse(localStorage.getItem('flashCustomDecks') || '{}');

        window.onload = () => {
            const savedName = localStorage.getItem('flashName');
            if(savedName) { userName = savedName; document.getElementById('user-display').innerText = userName; showScreen('screen-mode'); }
            else showScreen('screen-profile');
            renderDeckHub();
            updateLeaderboard();
        };

        function showScreen(id) {
            document.querySelectorAll('.menu-card, #game-ui').forEach(s => s.style.display = 'none');
            const target = document.getElementById(id);
            target.style.display = (id === 'game-ui') ? 'flex' : 'block';
            if(id === 'screen-mode') renderDeckHub();
        }

        /* ARCHITECT LOGIC */
        function showArchitect() {
            showScreen('screen-architect');
            document.getElementById('architect-nodes').innerHTML = "";
            document.getElementById('custom-deck-name').value = "";
            addNode();
        }

        function addNode() {
            const row = document.createElement('div');
            row.className = 'architect-row';
            row.innerHTML = `
                <span class="remove-node" onclick="this.parentElement.remove()">×</span>
                <input type="text" placeholder="Question" class="node-q">
                <input type="text" placeholder="Answer" class="node-a">
            `;
            document.getElementById('architect-nodes').appendChild(row);
        }

        function saveCustomDeck() {
            const name = document.getElementById('custom-deck-name').value.trim();
            if(!name) return alert("Give your deck a name!");
            
            const nodes = [];
            document.querySelectorAll('.architect-row').forEach(row => {
                const q = row.querySelector('.node-q').value.trim();
                const a = row.querySelector('.node-a').value.trim();
                if(q && a) nodes.push({q, a});
            });

            if(nodes.length === 0) return alert("Add at least one question!");

            customDecks[name] = nodes;
            localStorage.setItem('flashCustomDecks', JSON.stringify(customDecks));
            alert("Deck Synchronized!");
            showScreen('screen-mode');
        }

        function renderDeckHub() {
            const container = document.getElementById('deck-list-container');
            container.innerHTML = `<div class="deck-pill selected" onclick="selectDeck('default', this)">Default Studio Deck</div>`;
            
            Object.keys(customDecks).forEach(name => {
                const pill = document.createElement('div');
                pill.className = 'deck-pill';
                pill.innerHTML = `<span>${name}</span> <span style="font-size:0.6rem; opacity:0.5" onclick="deleteDeck('${name}', event)">DELETE</span>`;
                pill.onclick = () => selectDeck(name, pill);
                container.appendChild(pill);
            });
        }

        function selectDeck(name, el) {
            document.querySelectorAll('.deck-pill').forEach(p => p.classList.remove('selected'));
            el.classList.add('selected');
            activeDeckData = (name === 'default') ? [...defaultDeck] : customDecks[name];
            // Add visual "sync" effect
            document.getElementById('card').classList.add('custom-sync');
            setTimeout(() => document.getElementById('card').classList.remove('custom-sync'), 300);
        }

        function deleteDeck(name, e) {
            e.stopPropagation();
            if(confirm(`Delete ${name}?`)) {
                delete customDecks[name];
                localStorage.setItem('flashCustomDecks', JSON.stringify(customDecks));
                renderDeckHub();
                activeDeckData = [...defaultDeck];
            }
        }

        /* CORE GAMEPLAY (Preserving all logic) */
        function saveProfile() {
            const val = document.getElementById('nickname-input').value.trim();
            if(val) { userName = val; localStorage.setItem('flashName', val); document.getElementById('user-display').innerText = val; showScreen('screen-mode'); }
        }

        function logout() { localStorage.removeItem('flashName'); location.reload(); }

        function setMode(m) { gameMode = m; showScreen('screen-size'); }

        function startGame(limit) {
            isReviewMode = false; score = 0; currentIndex = 0; missedCards = []; currentStreak = 0;
            document.getElementById('score-text').innerText = "0";
            document.getElementById('log-list').innerHTML = "";
            showScreen('game-ui');
            document.getElementById('timer-container').style.display = (gameMode === 'Speed') ? 'block' : 'none';
            currentDeck = [...activeDeckData].sort(() => Math.random() - 0.5).slice(0, limit);
            updateUI();
        }

        function updateUI() {
            if (currentIndex >= currentDeck.length) { showGameOver(); return; }
            document.getElementById('progress-bar-fill').style.width = (currentIndex / currentDeck.length) * 100 + "%";
            document.getElementById('card').classList.remove('flipped');
            document.getElementById('q-text').innerText = currentDeck[currentIndex].q;
            document.getElementById('a-text').innerText = currentDeck[currentIndex].a;
            document.getElementById('counter').innerText = `CARD ${currentIndex + 1} / ${currentDeck.length}`;
            lock = false;
            if(gameMode === 'Speed') startTimer();
        }

        function handleAnswer(isRight) {
            if (lock) return; lock = true; clearInterval(timerInterval);
            const q = currentDeck[currentIndex];
            const logItem = document.createElement('li');
            logItem.className = 'log-item' + (isRight ? ' can-open' : '');
            logItem.innerHTML = `<div class="log-header" onclick="${isRight ? 'toggleAnswer(this)' : ''}"><span>${q.q}</span><span>${isRight?'✔':'✖'}</span></div><div class="log-answer">Answer: ${q.a}</div>`;
            document.getElementById('log-list').prepend(logItem);

            if(isRight) {
                score++; currentStreak++;
                if(currentStreak > bestStreak) bestStreak = currentStreak;
                document.getElementById('score-text').innerText = score;
                setTimeout(() => { currentIndex++; updateUI(); }, 500);
            } else {
                currentStreak = 0;
                missedCards.push(q);
                document.getElementById('card').classList.add('flipped');
                setTimeout(() => { currentIndex++; updateUI(); }, 1500);
            }
            document.getElementById('streak-chip').innerText = `Streak: ${currentStreak} | Best: ${bestStreak}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            let timeLeft = 100;
            timerInterval = setInterval(() => {
                timeLeft -= 2;
                document.getElementById('timer-bar').style.width = timeLeft + "%";
                if(timeLeft <= 0) { clearInterval(timerInterval); handleAnswer(false); }
            }, 200);
        }

        function showGameOver() {
            showScreen('screen-over');
            document.getElementById('final-stats').innerText = `Result: ${score} / ${currentDeck.length}`;
            saveScore(score, currentDeck.length, gameMode);
        }

        function toggleAnswer(el) { el.parentElement.classList.toggle('open'); }
        function saveScore(s, t, m) {
            const scores = JSON.parse(localStorage.getItem('flashScores') || '[]');
            scores.push({name: userName, score: s, total: t, mode: m});
            localStorage.setItem('flashScores', JSON.stringify(scores));
            updateLeaderboard();
        }
        function updateLeaderboard() {
            const scores = JSON.parse(localStorage.getItem('flashScores') || '[]');
            const content = document.getElementById('lb-content');
            content.innerHTML = scores.sort((a,b) => (b.score/b.total) - (a.score/a.total)).slice(0, 5).map(s => `
                <div style="font-size:0.7rem; padding:5px; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between">
                    <span>${s.name}</span><b>${s.score}/${s.total}</b>
                </div>`).join('');
        }
        function resetLeaderboard() { localStorage.removeItem('flashScores'); updateLeaderboard(); }
    </script>
</body>
</html>
