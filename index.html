<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Pro - Speed Run</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; display: flex; height: 100vh; 
            background: var(--bg); color: white; overflow: hidden;
        }

        /* SIDEBAR */
        #sidebar {
            width: 320px; min-width: 320px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px; display: flex; flex-direction: column;
            z-index: 10;
        }

        #log-list { flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; margin-top: 15px; }
        .log-item { margin-bottom: 8px; border-radius: 12px; background: rgba(255,255,255,0.05); overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .log-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .log-answer { max-height: 0; padding: 0 12px; font-size: 0.8rem; background: rgba(99, 102, 241, 0.2); transition: 0.3s ease-in-out; overflow: hidden; }
        .log-item.open .log-answer { max-height: 100px; padding: 12px; border-top: 1px solid rgba(255,255,255,0.1); }

        /* MAIN AREA */
        #game-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; }

        /* TIMER BAR */
        #timer-container { position: absolute; top: 8px; left: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.1); display: none; }
        #timer-bar { width: 100%; height: 100%; background: #fbbf24; transition: width 0.1s linear; }

        /* MENU SCREEN */
        .menu-card { text-align: center; background: white; color: #333; padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 350px; }
        .btn-mode { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; margin: 10px 0; width: 100%; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        .btn-mode:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* CARD */
        .card { width: 400px; height: 280px; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 40px; border-radius: 28px; font-size: 1.5rem; font-weight: 700; box-sizing: border-box; }
        .front { background: white; color: #1e293b; }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }

        .btn-group { display: flex; gap: 20px; margin-top: 40px; }
        button { padding: 18px 35px; border: none; border-radius: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-wrong { background: var(--danger); color: white; }
        .btn-right { background: var(--success); color: white; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h2>Review Log</h2>
        <div style="background: var(--primary); padding: 15px; border-radius: 15px; text-align:center;">
            <span id="score-text" style="font-size: 1.4rem; font-weight:bold;">Score: 0</span>
        </div>
        <ul id="log-list"></ul>
    </aside>

    <main id="game-container">
        <div id="timer-container"><div id="timer-bar"></div></div>

        <div id="menu-step-1" class="menu-card">
            <h1>Game Mode</h1>
            <button class="btn-mode" onclick="setMode('normal')">Normal Mode</button>
            <button class="btn-mode" style="background: #fbbf24; color: #000;" onclick="setMode('speed')">⚡ Speed Run (10s/card)</button>
        </div>

        <div id="menu-step-2" class="menu-card" style="display:none;">
            <h1>How many cards?</h1>
            <button class="btn-mode" onclick="startGame(10)">Sprint (10 Cards)</button>
            <button class="btn-mode" onclick="startGame(50)">Marathon (50 Cards)</button>
        </div>
        
        <div id="game-ui" style="display: none; flex-direction: column; align-items: center;">
            <div id="counter" style="margin-bottom: 20px; font-weight: 800; background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 30px;">CARD 1</div>
            <div class="card" id="card" onclick="this.classList.toggle('flipped')">
                <div class="card-inner"><div class="front" id="q-text"></div><div class="back" id="a-text"></div></div>
            </div>
            <div class="btn-group">
                <button class="btn-wrong" onclick="handleAnswer(false)">❌ Missed It</button>
                <button class="btn-right" onclick="handleAnswer(true)">✅ Got It!</button>
            </div>
        </div>

        <div id="game-over" class="menu-card" style="display:none;">
            <h1 id="over-title">Finished!</h1>
            <p id="final-stats"></p>
            <button id="retry-missed-btn" class="btn-mode" style="background: var(--danger);" onclick="replayMissed()">Study Missed Cards</button>
            <button class="btn-mode" onclick="location.reload()">Menu</button>
        </div>
    </main>

    <script>
        let audioCtx;
        function playSfx(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            // MASTER LIMITER (Prevents loud random pops)
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            
            if (type === 'correct') {
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.01);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.01);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            }
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        const rawDeck = [
            { q: "What is the capital of Japan?", a: "Tokyo" },
            { q: "How many continents are there?", a: "7" },
            { q: "What is the square root of 144?", a: "12" },
            { q: "Which planet is closest to the sun?", a: "Mercury" },
            { q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" },
            { q: "What is the chemical symbol for Gold?", a: "Au" },
            { q: "What does CPU stand for?", a: "Central Processing Unit" },
            { q: "Which ocean is the largest?", a: "Pacific Ocean" },
            { q: "What is the fastest land animal?", a: "Cheetah" },
            { q: "How many colors are in a rainbow?", a: "7" },
            { q: "What is the powerhouse of the cell?", a: "Mitochondria" },
            { q: "In what year did the Titanic sink?", a: "1912" },
            { q: "What is the hardest natural substance?", a: "Diamond" },
            { q: "Which gas do plants breathe in?", a: "Carbon Dioxide" },
            { q: "What is the capital of Italy?", a: "Rome" },
            { q: "Who invented the lightbulb?", a: "Thomas Edison" },
            { q: "What is the largest organ in the human body?", a: "Skin" },
            { q: "How many bones are in the adult human body?", a: "206" },
            { q: "What is the main ingredient in hummus?", a: "Chickpeas" },
            { q: "Which country gifted the Statue of Liberty to the USA?", a: "France" },
            { q: "What is the boiling point of water (Celsius)?", a: "100°C" },
            { q: "What is the smallest prime number?", a: "2" },
            { q: "Who was the first person to walk on the moon?", a: "Neil Armstrong" },
            { q: "What is the longest river in the world?", a: "The Nile" },
            { q: "What does URL stand for?", a: "Uniform Resource Locator" },
            { q: "Which planet has the most rings?", a: "Saturn" },
            { q: "What is the currency of the United Kingdom?", a: "Pound Sterling" },
            { q: "How many states are in the USA?", a: "50" },
            { q: "Who painted the 'Starry Night'?", a: "Vincent van Gogh" },
            { q: "What is the primary language spoken in Brazil?", a: "Portuguese" },
            { q: "What is the largest desert in the world?", a: "Antarctica" },
            { q: "How many strings does a standard guitar have?", a: "6" },
            { q: "What is the Greek god of the sea?", a: "Poseidon" },
            { q: "What is the chemical symbol for Water?", a: "H2O" },
            { q: "Which country is known as the Land of the Rising Sun?", a: "Japan" },
            { q: "What is the capital of Canada?", a: "Ottawa" },
            { q: "Who is the author of Harry Potter?", a: "J.K. Rowling" },
            { q: "What is the tallest mountain in the world?", a: "Mount Everest" },
            { q: "What is 15% of 200?", a: "30" },
            { q: "Which element has the atomic number 1?", a: "Hydrogen" },
            { q: "What is the capital of Spain?", a: "Madrid" },
            { q: "How many years are in a century?", a: "100" },
            { q: "What is the largest species of shark?", a: "Whale Shark" },
            { q: "Who discovered penicillin?", a: "Alexander Fleming" },
            { q: "What is the main gas in Earth's atmosphere?", a: "Nitrogen" },
            { q: "In which city is the Eiffel Tower located?", a: "Paris" },
            { q: "What is the study of weather called?", a: "Meteorology" },
            { q: "How many degrees are in a right angle?", a: "90°" },
            { q: "What is the capital of Australia?", a: "Canberra" },
            { q: "What is the most spoken language in the world?", a: "Mandarin Chinese" }
        ];

        let currentDeck = [], missedCards = [], gameMode = 'normal', currentIndex = 0, score = 0, lock = false, timerInterval;

        function setMode(m) {
            gameMode = m;
            document.getElementById('menu-step-1').style.display = 'none';
            document.getElementById('menu-step-2').style.display = 'block';
        }

        function startGame(limit) {
            document.getElementById('menu-step-2').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            if (gameMode === 'speed') document.getElementById('timer-container').style.display = 'block';
            currentDeck = [...rawDeck].sort(() => Math.random() - 0.5).slice(0, limit);
            updateUI();
        }

        function startTimer() {
            clearInterval(timerInterval);
            if (gameMode !== 'speed') return;
            let timeLeft = 100;
            const bar = document.getElementById('timer-bar');
            timerInterval = setInterval(() => {
                timeLeft -= 1;
                bar.style.width = timeLeft + "%";
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(false); // Timeout = Wrong
                }
            }, 100);
        }

        function updateUI() {
            if (currentIndex >= currentDeck.length) { showGameOver(); return; }
            const q = document.getElementById('q-text'), a = document.getElementById('a-text');
            q.style.opacity = "0"; a.style.opacity = "0";
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                q.innerText = currentDeck[currentIndex].q;
                a.innerText = currentDeck[currentIndex].a;
                document.getElementById('counter').innerText = `CARD ${currentIndex + 1} / ${currentDeck.length}`;
                q.style.opacity = "1"; a.style.opacity = "1";
                lock = false;
                startTimer();
            }, 300);
        }

        function handleAnswer(isRight) {
            if (lock) return; lock = true;
            clearInterval(timerInterval);
            const currentQ = currentDeck[currentIndex];
            const logItem = document.createElement('li');
            logItem.className = 'log-item' + (isRight ? ' unlocked' : '');
            logItem.innerHTML = `<div class="log-header" onclick="${isRight ? 'toggleAnswer(this)' : ''}"><span>${currentQ.q}</span><span>${isRight ? '✔' : '✖'}</span></div><div class="log-answer">Answer: ${currentQ.a}</div>`;
            document.getElementById('log-list').prepend(logItem);

            if (isRight) {
                playSfx('correct'); score++;
                document.getElementById('score-text').innerText = `Score: ${score}`;
                setTimeout(() => { currentIndex++; updateUI(); }, 500);
            } else {
                playSfx('wrong'); missedCards.push(currentQ);
                document.getElementById('card').classList.add('flipped');
                setTimeout(() => { currentIndex++; updateUI(); }, 2000);
            }
        }

        function showGameOver() {
            clearInterval(timerInterval);
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('timer-container').style.display = 'none';
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-stats').innerText = `Mode: ${gameMode.toUpperCase()} | Score: ${score}/${currentDeck.length}`;
            document.getElementById('retry-missed-btn').style.display = missedCards.length > 0 ? 'block' : 'none';
        }

        function replayMissed() {
            currentDeck = [...missedCards]; missedCards = []; currentIndex = 0; score = 0;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            if (gameMode === 'speed') document.getElementById('timer-container').style.display = 'block';
            document.getElementById('log-list').innerHTML = "";
            document.getElementById('score-text').innerText = "Score: 0";
            updateUI();
        }

        function toggleAnswer(el) {
            const p = el.parentElement; const isOpen = p.classList.contains('open');
            document.querySelectorAll('.log-item').forEach(i => i.classList.remove('open'));
            if (!isOpen) p.classList.add('open');
        }
    </script>
</body>
</html>
