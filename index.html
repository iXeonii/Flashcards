<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Pro - Sound Edition</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; display: flex; height: 100vh; 
            background: var(--bg); color: white; overflow: hidden;
        }

        /* SIDEBAR REVIEW LOG */
        #sidebar {
            width: 320px; min-width: 320px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px; display: flex; flex-direction: column;
            z-index: 10;
        }

        #log-list { 
            flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; margin-top: 15px;
        }

        .log-item { 
            margin-bottom: 8px; border-radius: 12px;
            background: rgba(255,255,255,0.05); overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .log-header {
            padding: 12px; display: flex; justify-content: space-between;
            align-items: center; font-size: 0.85rem; transition: 0.2s;
        }

        .log-item.unlocked .log-header { cursor: pointer; }
        .log-item.unlocked .log-header:hover { background: rgba(255,255,255,0.15); }

        .log-answer {
            max-height: 0; padding: 0 12px; font-size: 0.8rem;
            background: rgba(99, 102, 241, 0.2); color: #c7d2fe;
            transition: all 0.3s ease-in-out; overflow: hidden;
        }

        .log-item.open { border-color: var(--primary); }
        .log-item.open .log-answer {
            max-height: 100px; padding: 12px; border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* MAIN GAME AREA */
        #game-container {
            flex-grow: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; position: relative;
            padding: 20px;
        }

        .progress-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: rgba(0,0,0,0.3);
        }
        #progress-bar { width: 0%; height: 100%; background: var(--success); transition: 0.4s ease; }

        /* THE CARD */
        .card { width: 400px; height: 280px; perspective: 1000px; cursor: pointer; z-index: 5; }
        .card-inner { 
            position: relative; width: 100%; height: 100%; text-align: center; 
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; 
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        .front, .back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; align-items: center; justify-content: center; padding: 40px; 
            border-radius: 28px; font-size: 1.5rem; font-weight: 700; box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            box-sizing: border-box;
            transition: opacity 0.3s ease-in-out; 
        }
        .front { background: white; color: #1e293b; }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }

        /* BUTTONS */
        .btn-group { display: flex; gap: 20px; margin-top: 40px; z-index: 20; position: relative; }
        button { 
            padding: 18px 35px; border: none; border-radius: 16px; font-weight: 800; 
            cursor: pointer; transition: 0.2s; font-size: 1rem; text-transform: uppercase;
        }
        .btn-wrong { background: var(--danger); color: white; box-shadow: 0 4px 0 #b91c1c; }
        .btn-right { background: var(--success); color: white; box-shadow: 0 4px 0 #15803d; }
        button:active { transform: translateY(3px); box-shadow: none; }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }

        #game-over { 
            display: none; text-align: center; background: white; color: #333; 
            padding: 60px; border-radius: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h2 style="margin-top:0; letter-spacing: -1px;">Review Log</h2>
        <div style="background: var(--primary); padding: 15px; border-radius: 15px; text-align:center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <span id="score-text" style="font-size: 1.4rem; font-weight:bold;">Score: 0</span>
            <div style="font-size: 0.7rem; margin-top: 5px; opacity: 0.8; font-weight: bold;">CLICK ✔ TO SEE ANSWERS</div>
        </div>
        <ul id="log-list"></ul>
    </aside>

    <main id="game-container">
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div id="game-ui" style="display: flex; flex-direction: column; align-items: center;">
            <div id="counter" style="margin-bottom: 20px; font-weight: 800; background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 30px; font-size: 0.9rem;">CARD 1 / 50</div>
            
            <div class="card" id="card" onclick="this.classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="front" id="q-text">Question</div>
                    <div class="back" id="a-text">Answer</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-wrong" onclick="handleAnswer(false)">❌ Missed It</button>
                <button class="btn-right" onclick="handleAnswer(true)">✅ Got It!</button>
            </div>
        </div>

        <div id="game-over">
            <h1 style="font-size: 3.5rem; margin: 0; color: var(--primary);">Winner! 🏆</h1>
            <p id="final-stats" style="font-size: 1.4rem; margin: 25px 0; font-weight: 600;"></p>
            <button onclick="location.reload()" style="background: var(--primary); color: white; width: 100%; font-size: 1.2rem;">Shuffle & Play Again</button>
        </div>
    </main>

    <script>
        // SOUND EFFECTS (Using short Base64 sounds)
        const correctSound = new Audio("data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQYAAAAfAh8CHwIfAh8CHw==");
        // Frequency-based synth sounds (cleaner for web)
        function playSfx(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1); // A5
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            }
            
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }

        const rawDeck = [
            { q: "What is the capital of Japan?", a: "Tokyo" },
            { q: "How many continents are there?", a: "7" },
            { q: "What is the square root of 144?", a: "12" },
            { q: "Which planet is closest to the sun?", a: "Mercury" },
            { q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" },
            { q: "What is the chemical symbol for Gold?", a: "Au" },
            { q: "What does CPU stand for?", a: "Central Processing Unit" },
            { q: "Which ocean is the largest?", a: "Pacific Ocean" },
            { q: "What is the fastest land animal?", a: "Cheetah" },
            { q: "How many colors are in a rainbow?", a: "7" },
            { q: "What is the powerhouse of the cell?", a: "Mitochondria" },
            { q: "In what year did the Titanic sink?", a: "1912" },
            { q: "What is the hardest natural substance?", a: "Diamond" },
            { q: "Which gas do plants breathe in?", a: "Carbon Dioxide" },
            { q: "What is the capital of Italy?", a: "Rome" },
            { q: "Who invented the lightbulb?", a: "Thomas Edison" },
            { q: "What is the largest organ in the human body?", a: "Skin" },
            { q: "How many bones are in the adult human body?", a: "206" },
            { q: "What is the main ingredient in hummus?", a: "Chickpeas" },
            { q: "Which country gifted the Statue of Liberty to the USA?", a: "France" },
            { q: "What is the boiling point of water (Celsius)?", a: "100°C" },
            { q: "What is the smallest prime number?", a: "2" },
            { q: "Who was the first person to walk on the moon?", a: "Neil Armstrong" },
            { q: "What is the longest river in the world?", a: "The Nile" },
            { q: "What does URL stand for?", a: "Uniform Resource Locator" },
            { q: "Which planet has the most rings?", a: "Saturn" },
            { q: "What is the currency of the United Kingdom?", a: "Pound Sterling" },
            { q: "How many states are in the USA?", a: "50" },
            { q: "Who painted the 'Starry Night'?", a: "Vincent van Gogh" },
            { q: "What is the primary language spoken in Brazil?", a: "Portuguese" },
            { q: "What is the largest desert in the world?", a: "Antarctica" },
            { q: "How many strings does a standard guitar have?", a: "6" },
            { q: "What is the Greek god of the sea?", a: "Poseidon" },
            { q: "What is the chemical symbol for Water?", a: "H2O" },
            { q: "Which country is known as the Land of the Rising Sun?", a: "Japan" },
            { q: "What is the capital of Canada?", a: "Ottawa" },
            { q: "Who is the author of Harry Potter?", a: "J.K. Rowling" },
            { q: "What is the tallest mountain in the world?", a: "Mount Everest" },
            { q: "What is 15% of 200?", a: "30" },
            { q: "Which element has the atomic number 1?", a: "Hydrogen" },
            { q: "What is the capital of Spain?", a: "Madrid" },
            { q: "How many years are in a century?", a: "100" },
            { q: "What is the largest species of shark?", a: "Whale Shark" },
            { q: "Who discovered penicillin?", a: "Alexander Fleming" },
            { q: "What is the main gas in Earth's atmosphere?", a: "Nitrogen" },
            { q: "In which city is the Eiffel Tower located?", a: "Paris" },
            { q: "What is the study of weather called?", a: "Meteorology" },
            { q: "How many degrees are in a right angle?", a: "90°" },
            { q: "What is the capital of Australia?", a: "Canberra" },
            { q: "What is the most spoken language in the world?", a: "Mandarin Chinese" }
        ];

        let deck = [...rawDeck].sort(() => Math.random() - 0.5);
        let currentIndex = 0;
        let score = 0;
        let lock = false;

        function updateUI() {
            if (currentIndex >= deck.length) {
                document.getElementById('game-ui').style.display = 'none';
                document.getElementById('game-over').style.display = 'block';
                document.getElementById('final-stats').innerText = `You mastered ${score} out of ${deck.length} cards!`;
                return;
            }

            const qText = document.getElementById('q-text');
            const aText = document.getElementById('a-text');
            const card = document.getElementById('card');

            qText.style.opacity = "0";
            aText.style.opacity = "0";
            card.classList.remove('flipped');

            setTimeout(() => {
                qText.innerText = deck[currentIndex].q;
                aText.innerText = deck[currentIndex].a;
                document.getElementById('counter').innerText = `CARD ${currentIndex + 1} / ${deck.length}`;
                document.getElementById('progress-bar').style.width = `${((currentIndex) / deck.length) * 100}%`;
                qText.style.opacity = "1";
                aText.style.opacity = "1";
                lock = false;
            }, 300); 
        }

        function handleAnswer(isRight) {
            if (lock) return;
            lock = true;

            const currentQ = deck[currentIndex];
            const logList = document.getElementById('log-list');
            const logItem = document.createElement('li');
            logItem.className = 'log-item' + (isRight ? ' unlocked' : '');
            
            logItem.innerHTML = `
                <div class="log-header" onclick="${isRight ? 'toggleAnswer(this)' : ''}">
                    <span style="max-width: 80%; font-weight: 500;">${currentQ.q}</span>
                    <span style="font-weight: 900; color:${isRight ? 'var(--success)' : 'var(--danger)'}">${isRight ? '✔' : '✖'}</span>
                </div>
                <div class="log-answer"><strong>Answer:</strong> ${currentQ.a}</div>
            `;
            
            if (isRight) {
                playSfx('correct'); // PLAY SOUND
                score++;
                document.getElementById('score-text').innerText = `Score: ${score}`;
                setTimeout(next, 500);
            } else {
                playSfx('wrong'); // PLAY SOUND
                document.getElementById('card').classList.add('flipped');
                setTimeout(next, 2000);
            }
            logList.prepend(logItem);
        }

        function toggleAnswer(el) {
            const parent = el.parentElement;
            const isOpen = parent.classList.contains('open');
            document.querySelectorAll('.log-item').forEach(item => item.classList.remove('open'));
            if (!isOpen) parent.classList.add('open');
        }

        function next() {
            currentIndex++;
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
