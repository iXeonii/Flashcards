<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Pro - Hall of Fame</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #fbbf24;
            --bg: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%);
        }

        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: white; overflow: hidden; }

        /* SIDEBAR */
        #sidebar { width: 340px; min-width: 340px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); padding: 20px; display: flex; flex-direction: column; z-index: 10; }
        #log-list { flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; margin-top: 10px; }
        .log-item { margin-bottom: 8px; border-radius: 12px; background: rgba(255,255,255,0.05); overflow: hidden; border: 2px solid transparent; transition: 0.3s; cursor: pointer; }
        .log-item.open { border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
        .log-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .status-icon { font-weight: 900; font-size: 1.1rem; }
        .status-icon.right { color: var(--success); }
        .status-icon.wrong { color: var(--danger); }
        .log-answer { max-height: 0; padding: 0 12px; font-size: 0.8rem; background: rgba(99, 102, 241, 0.2); transition: 0.3s ease-in-out; overflow: hidden; }
        .log-item.open .log-answer { max-height: 100px; padding: 12px; border-top: 1px solid rgba(255,255,255,0.1); }

        /* LEADERBOARD REBORN */
        #leaderboard { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .lb-title { font-size: 1rem; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .lb-entry { position: relative; padding: 8px 12px; margin-bottom: 6px; border-radius: 8px; background: rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .lb-bar { position: absolute; left: 0; top: 0; height: 100%; background: var(--primary); opacity: 0.15; z-index: 0; transition: width 1s ease-out; }
        .lb-rank { font-weight: 900; width: 20px; z-index: 1; }
        .lb-info { flex-grow: 1; padding-left: 10px; z-index: 1; }
        .lb-score { font-weight: 800; z-index: 1; color: var(--warning); }
        .medal-1 { color: #ffd700; } .medal-2 { color: #c0c0c0; } .medal-3 { color: #cd7f32; }

        /* MAIN AREA */
        #game-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; }
        .bar-wrapper { position: absolute; top: 0; left: 0; width: 100%; z-index: 100; }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.3); }
        #progress-bar-fill { width: 0%; height: 100%; background: var(--success); transition: width 0.4s ease; }
        #timer-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); display: none; }
        #timer-bar { width: 100%; height: 100%; background: var(--success); transition: width 0.1s linear; }

        /* MENU SCREEN */
        .menu-card { text-align: center; background: white; color: #333; padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 380px; }
        .btn-mode { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; margin: 10px 0; width: 100%; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        .btn-mode:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* CARD */
        .card { width: 420px; height: 300px; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 40px; border-radius: 28px; font-size: 1.6rem; font-weight: 700; box-sizing: border-box; transition: opacity 0.3s; }
        .front { background: white; color: #1e293b; }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }

        .btn-group { display: flex; gap: 20px; margin-top: 40px; }
        button { padding: 18px 35px; border: none; border-radius: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-wrong { background: var(--danger); color: white; }
        .btn-right { background: var(--success); color: white; }
        .hint-text { font-size: 0.7rem; text-align: center; margin-bottom: 5px; color: var(--warning); font-weight: bold; opacity: 0.7; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h2 style="margin: 0 0 5px 0;">Flash Focus</h2>
        <div class="hint-text">Click cards below to review</div>
        
        <div style="background: var(--primary); padding: 15px; border-radius: 15px; text-align:center; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <div style="font-size: 0.7rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px;">Current Score</div>
            <span id="score-text" style="font-size: 1.6rem; font-weight:900;">0</span>
        </div>

        <ul id="log-list"></ul>

        <div id="leaderboard">
            <div class="lb-title">🏆 Hall of Fame</div>
            <div id="lb-content"></div>
            <button onclick="localStorage.clear(); updateLeaderboard();" style="background:none; border:none; color:white; font-size:0.6rem; opacity:0.3; cursor:pointer; width:100%; text-align:right;">Clear Records</button>
        </div>
    </aside>

    <main id="game-container">
        <div class="bar-wrapper">
            <div class="progress-bar-bg"><div id="progress-bar-fill"></div></div>
            <div id="timer-container"><div id="timer-bar"></div></div>
        </div>

        <div id="menu-step-1" class="menu-card">
            <h1 style="margin:0 0 10px 0;">Game Mode</h1>
            <p style="margin-bottom:20px; color:#666;">Choose your challenge level</p>
            <button class="btn-mode" onclick="setMode('Normal')">Standard Study</button>
            <button class="btn-mode" style="background: #fbbf24; color: #000;" onclick="setMode('Speed')">⚡ Speed Blitz (10s)</button>
        </div>

        <div id="menu-step-2" class="menu-card" style="display:none;">
            <h1 style="margin:0 0 10px 0;">Session Size</h1>
            <button class="btn-mode" onclick="startGame(10)">Sprint (10 Cards)</button>
            <button class="btn-mode" onclick="startGame(50)">Marathon (50 Cards)</button>
        </div>
        
        <div id="game-ui" style="display: none; flex-direction: column; align-items: center;">
            <div id="counter" style="margin-bottom: 20px; font-weight: 800; background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 30px; font-size: 0.8rem; letter-spacing: 1px;">CARD 1</div>
            <div class="card" id="card" onclick="this.classList.toggle('flipped')">
                <div class="card-inner"><div class="front" id="q-text"></div><div class="back" id="a-text"></div></div>
            </div>
            <div class="btn-group">
                <button class="btn-wrong" onclick="handleAnswer(false)">❌ Missed</button>
                <button class="btn-right" onclick="handleAnswer(true)">✅ Got It!</button>
            </div>
        </div>

        <div id="game-over" class="menu-card" style="display:none;">
            <h1 id="over-title">Session Ended</h1>
            <p id="final-stats" style="font-size: 1.2rem; font-weight: bold; color: var(--primary);"></p>
            <button id="retry-missed-btn" class="btn-mode" style="background: var(--danger);" onclick="replayMissed()">Review Mistakes</button>
            <button class="btn-mode" onclick="location.reload()">Back to Start</button>
        </div>
    </main>

    <script>
        let audioCtx, currentDeck = [], missedCards = [], gameMode = 'Normal', currentIndex = 0, score = 0, lock = false, timerInterval;

        function playSfx(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0, audioCtx.currentTime);
            if (type === 'correct') {
                o.frequency.setValueAtTime(523, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime+0.1);
                g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime+0.01); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.2);
            } else {
                o.type='sawtooth'; o.frequency.setValueAtTime(120, audioCtx.currentTime);
                g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime+0.01); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.3);
            }
            o.start(); o.stop(audioCtx.currentTime+0.3);
        }

        const rawDeck = [
            { q: "What is the capital of Japan?", a: "Tokyo" },
            { q: "How many continents are there?", a: "7" },
            { q: "What is the square root of 144?", a: "12" },
            { q: "Which planet is closest to the sun?", a: "Mercury" },
            { q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" },
            { q: "What is the chemical symbol for Gold?", a: "Au" },
            { q: "What does CPU stand for?", a: "Central Processing Unit" },
            { q: "Which ocean is the largest?", a: "Pacific Ocean" },
            { q: "What is the fastest land animal?", a: "Cheetah" },
            { q: "How many colors are in a rainbow?", a: "7" },
            { q: "What is the powerhouse of the cell?", a: "Mitochondria" },
            { q: "In what year did the Titanic sink?", a: "1912" },
            { q: "What is the hardest natural substance?", a: "Diamond" },
            { q: "Which gas do plants breathe in?", a: "Carbon Dioxide" },
            { q: "What is the capital of Italy?", a: "Rome" },
            { q: "Who invented the lightbulb?", a: "Thomas Edison" },
            { q: "What is the largest organ in the human body?", a: "Skin" },
            { q: "How many bones are in the adult human body?", a: "206" },
            { q: "What is the main ingredient in hummus?", a: "Chickpeas" },
            { q: "Which country gifted the Statue of Liberty to the USA?", a: "France" },
            { q: "What is the boiling point of water (Celsius)?", a: "100°C" },
            { q: "What is the smallest prime number?", a: "2" },
            { q: "Who was the first person to walk on the moon?", a: "Neil Armstrong" },
            { q: "What is the longest river in the world?", a: "The Nile" },
            { q: "What does URL stand for?", a: "Uniform Resource Locator" },
            { q: "Which planet has the most rings?", a: "Saturn" },
            { q: "What is the currency of the United Kingdom?", a: "Pound Sterling" },
            { q: "How many states are in the USA?", a: "50" },
            { q: "Who painted the 'Starry Night'?", a: "Vincent van Gogh" },
            { q: "What is the primary language spoken in Brazil?", a: "Portuguese" },
            { q: "What is the largest desert in the world?", a: "Antarctica" },
            { q: "How many strings does a standard guitar have?", a: "6" },
            { q: "What is the Greek god of the sea?", a: "Poseidon" },
            { q: "What is the chemical symbol for Water?", a: "H2O" },
            { q: "Which country is known as the Land of the Rising Sun?", a: "Japan" },
            { q: "What is the capital of Canada?", a: "Ottawa" },
            { q: "Who is the author of Harry Potter?", a: "J.K. Rowling" },
            { q: "What is the tallest mountain in the world?", a: "Mount Everest" },
            { q: "What is 15% of 200?", a: "30" },
            { q: "Which element has the atomic number 1?", a: "Hydrogen" },
            { q: "What is the capital of Spain?", a: "Madrid" },
            { q: "How many years are in a century?", a: "100" },
            { q: "What is the largest species of shark?", a: "Whale Shark" },
            { q: "Who discovered penicillin?", a: "Alexander Fleming" },
            { q: "What is the main gas in Earth's atmosphere?", a: "Nitrogen" },
            { q: "In which city is the Eiffel Tower located?", a: "Paris" },
            { q: "What is the study of weather called?", a: "Meteorology" },
            { q: "How many degrees are in a right angle?", a: "90°" },
            { q: "What is the capital of Australia?", a: "Canberra" },
            { q: "What is the most spoken language in the world?", a: "Mandarin Chinese" }
        ];

        function updateLeaderboard() {
            const scores = JSON.parse(localStorage.getItem('flashScores') || '[]');
            const content = document.getElementById('lb-content');
            content.innerHTML = scores.length ? '' : '<div style="font-size:0.7rem; opacity:0.5; padding:10px;">No records found. Set one!</div>';
            
            scores.sort((a,b) => (b.score/b.total) - (a.score/a.total)).slice(0, 5).forEach((s, i) => {
                const perc = (s.score / s.total) * 100;
                let medal = i === 0 ? 'medal-1' : i === 1 ? 'medal-2' : i === 2 ? 'medal-3' : '';
                let rankText = i < 3 ? '★' : i + 1;
                content.innerHTML += `
                    <div class="lb-entry">
                        <div class="lb-bar" style="width: ${perc}%"></div>
                        <div class="lb-rank ${medal}">${rankText}</div>
                        <div class="lb-info">${s.mode} (${s.total})</div>
                        <div class="lb-score">${s.score}/${s.total}</div>
                    </div>`;
            });
        }

        function saveScore(s, t, m) {
            const scores = JSON.parse(localStorage.getItem('flashScores') || '[]');
            scores.push({score: s, total: t, mode: m});
            localStorage.setItem('flashScores', JSON.stringify(scores));
            updateLeaderboard();
        }

        function setMode(m) { gameMode = m; document.getElementById('menu-step-1').style.display = 'none'; document.getElementById('menu-step-2').style.display = 'block'; }

        function startGame(limit) {
            document.getElementById('menu-step-2').style.display = 'none'; document.getElementById('game-ui').style.display = 'flex';
            if (gameMode === 'Speed') document.getElementById('timer-container').style.display = 'block';
            currentDeck = [...rawDeck].sort(() => Math.random() - 0.5).slice(0, limit);
            updateUI();
        }

        function startTimer() {
            clearInterval(timerInterval); if (gameMode !== 'Speed') return;
            let timeLeft = 100; const bar = document.getElementById('timer-bar');
            timerInterval = setInterval(() => {
                timeLeft -= 1; bar.style.width = timeLeft + "%";
                bar.style.backgroundColor = timeLeft > 60 ? 'var(--success)' : timeLeft > 30 ? 'var(--warning)' : 'var(--danger)';
                if (timeLeft <= 0) { clearInterval(timerInterval); handleAnswer(false); }
            }, 100);
        }

        function updateUI() {
            if (currentIndex >= currentDeck.length) { showGameOver(); return; }
            document.getElementById('progress-bar-fill').style.width = (currentIndex / currentDeck.length) * 100 + "%";
            const q = document.getElementById('q-text'), a = document.getElementById('a-text');
            q.style.opacity = "0"; a.style.opacity = "0"; document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                q.innerText = currentDeck[currentIndex].q; a.innerText = currentDeck[currentIndex].a;
                document.getElementById('counter').innerText = `CARD ${currentIndex + 1} / ${currentDeck.length}`;
                q.style.opacity = "1"; a.style.opacity = "1"; lock = false;
                if(gameMode === 'Speed') startTimer();
            }, 300);
        }

        function handleAnswer(isRight) {
            if (lock) return; lock = true; clearInterval(timerInterval);
            const currentQ = currentDeck[currentIndex];
            const logItem = document.createElement('li');
            logItem.className = 'log-item';
            logItem.innerHTML = `<div class="log-header" onclick="toggleAnswer(this)"><span>${currentQ.q}</span><span class="status-icon ${isRight?'right':'wrong'}">${isRight?'✔':'✖'}</span></div><div class="log-answer">Answer: ${currentQ.a}</div>`;
            document.getElementById('log-list').prepend(logItem);
            if (isRight) {
                playSfx('correct'); score++; document.getElementById('score-text').innerText = score;
                setTimeout(() => { currentIndex++; updateUI(); }, 500);
            } else {
                playSfx('wrong'); missedCards.push(currentQ); document.getElementById('card').classList.add('flipped');
                setTimeout(() => { currentIndex++; updateUI(); }, 2000);
            }
        }

        function showGameOver() {
            clearInterval(timerInterval);
            saveScore(score, currentDeck.length, gameMode);
            document.getElementById('progress-bar-fill').style.width = "100%";
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-stats').innerText = `RESULT: ${score} / ${currentDeck.length}`;
            document.getElementById('retry-missed-btn').style.display = missedCards.length > 0 ? 'block' : 'none';
        }

        function replayMissed() {
            currentDeck = [...missedCards]; missedCards = []; currentIndex = 0; score = 0;
            document.getElementById('game-over').style.display = 'none'; document.getElementById('game-ui').style.display = 'flex';
            if (gameMode === 'Speed') document.getElementById('timer-container').style.display = 'block';
            document.getElementById('log-list').innerHTML = ""; document.getElementById('score-text').innerText = "0"; updateUI();
        }

        function toggleAnswer(el) {
            const p = el.parentElement; const isOpen = p.classList.contains('open');
            document.querySelectorAll('.log-item').forEach(i => i.classList.remove('open'));
            if (!isOpen) p.classList.add('open');
        }

        updateLeaderboard();
    </script>
</body>
</html>
