<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Pro - Studio Edition</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #fbbf24;
            --bg: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%);
        }

        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: white; overflow: hidden; }

        /* SIDEBAR */
        #sidebar { width: 340px; min-width: 340px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); padding: 20px; display: flex; flex-direction: column; z-index: 10; }
        
        .user-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logout-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.7rem; transition: 0.2s; }
        .logout-btn:hover { background: var(--danger); }

        @keyframes pulseHint { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .hint-text { font-size: 0.75rem; text-align: center; margin-bottom: 10px; color: var(--warning); animation: pulseHint 2s infinite; }

        #log-list { flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; }
        .log-item { margin-bottom: 8px; border-radius: 12px; background: rgba(255,255,255,0.05); overflow: hidden; border: 2px solid transparent; transition: 0.2s; }
        .log-item.can-open { cursor: pointer; }
        .log-item.can-open:hover { background: rgba(255,255,255,0.1); }
        .log-item.open { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
        
        .log-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .status-icon.right { color: var(--success); }
        .status-icon.wrong { color: var(--danger); font-weight: bold; }
        .log-answer { max-height: 0; padding: 0 12px; font-size: 0.8rem; background: rgba(255,255,255,0.05); transition: 0.3s; overflow: hidden; }
        .log-item.open .log-answer { max-height: 100px; padding: 12px; border-top: 1px solid rgba(255,255,255,0.1); }

        /* LEADERBOARD */
        #leaderboard { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .lb-entry { position: relative; padding: 8px 12px; margin-bottom: 6px; border-radius: 8px; background: rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; overflow: hidden; }
        .lb-bar { position: absolute; left: 0; top: 0; height: 100%; background: var(--primary); opacity: 0.2; z-index: 0; }
        .reset-lb { background: none; border: none; color: #ff4444; font-size: 0.6rem; cursor: pointer; opacity: 0.5; width: 100%; text-align: center; margin-top: 5px; }
        .reset-lb:hover { opacity: 1; }

        /* MAIN AREA */
        #game-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; }
        .bar-wrapper { position: absolute; top: 0; left: 0; width: 100%; z-index: 100; }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.3); }
        #progress-bar-fill { width: 0%; height: 100%; background: var(--success); transition: width 0.4s ease; }
        #timer-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); display: none; }
        #timer-bar { width: 100%; height: 100%; background: var(--success); transition: width 0.1s linear; }

        /* MENUS */
        .menu-card { text-align: center; background: white; color: #333; padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 380px; display: none; }
        .btn-mode { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; margin: 10px 0; width: 100%; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        .btn-mode:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-back { background: none; border: none; color: #888; cursor: pointer; font-size: 0.8rem; margin-top: 10px; }

        /* CARD */
        .card { width: 420px; height: 300px; perspective: 1000px; cursor: pointer; margin-bottom: 20px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 40px; border-radius: 28px; font-size: 1.6rem; font-weight: 700; box-sizing: border-box; }
        .front { background: white; color: #1e293b; }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }

        .btn-group button { padding: 18px 35px; border: none; border-radius: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; margin: 0 10px; }
        .btn-wrong { background: var(--danger); color: white; }
        .btn-right { background: var(--success); color: white; }
        input#nickname-input { padding: 12px; width: 80%; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; font-size: 1rem; text-align: center; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="user-row">
            <span id="user-display" style="font-weight: bold; color: var(--warning);">Guest</span>
            <button class="logout-btn" onclick="logout()">Logout ⏻</button>
        </div>
        
        <div class="hint-text">Click ✔ items to review</div>
        
        <div style="background: var(--primary); padding: 15px; border-radius: 15px; text-align:center; margin-bottom: 10px;">
            <div id="score-label" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;">Current Score</div>
            <span id="score-text" style="font-size: 1.6rem; font-weight:900;">0</span>
        </div>

        <ul id="log-list"></ul>

        <div id="leaderboard">
            <div style="font-weight: 800; font-size: 0.9rem; margin-bottom: 10px;">🏆 Leaderboard</div>
            <div id="lb-content"></div>
            <button class="reset-lb" onclick="resetLeaderboard()">Reset Records</button>
        </div>
    </aside>

    <main id="game-container">
        <div class="bar-wrapper">
            <div class="progress-bar-bg"><div id="progress-bar-fill"></div></div>
            <div id="timer-container"><div id="timer-bar"></div></div>
        </div>

        <div id="screen-profile" class="menu-card">
            <h1>New Player</h1>
            <p>Enter your name to track scores:</p>
            <input type="text" id="nickname-input" placeholder="Nickname..." maxlength="12">
            <button class="btn-mode" onclick="saveProfile()">Enter Studio</button>
        </div>

        <div id="screen-mode" class="menu-card">
            <h1>Game Mode</h1>
            <button class="btn-mode" onclick="setMode('Normal')">Normal Mode</button>
            <button class="btn-mode" style="background: var(--warning); color: #000;" onclick="setMode('Speed')">⚡ Speed Blitz</button>
        </div>

        <div id="screen-size" class="menu-card">
            <h1>Session Size</h1>
            <button class="btn-mode" onclick="startGame(10)">Sprint (10)</button>
            <button class="btn-mode" onclick="startGame(50)">Marathon (50)</button>
            <button class="btn-back" onclick="showScreen('screen-mode')">← Change Mode</button>
        </div>
        
        <div id="game-ui" style="display: none; flex-direction: column; align-items: center;">
            <div id="counter" style="margin-bottom: 15px; font-weight: 800; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem;">CARD 1</div>
            <div class="card" id="card" onclick="this.classList.toggle('flipped')">
                <div class="card-inner"><div class="front" id="q-text"></div><div class="back" id="a-text"></div></div>
            </div>
            <div class="btn-group">
                <button class="btn-wrong" onclick="handleAnswer(false)">❌ Miss</button>
                <button class="btn-right" onclick="handleAnswer(true)">✅ Got It</button>
            </div>
        </div>

        <div id="screen-over" class="menu-card">
            <h1 id="over-title">Finished!</h1>
            <p id="final-stats" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
            <button id="retry-missed-btn" class="btn-mode" style="background: var(--danger);" onclick="replayMissed()">Review Mistakes</button>
            <button class="btn-mode" onclick="showScreen('screen-mode')">Menu</button>
        </div>
    </main>

    <script>
        let audioCtx, currentDeck = [], missedCards = [], gameMode = 'Normal', 
            currentIndex = 0, score = 0, lock = false, timerInterval, 
            isReviewMode = false, userName = "";

        const rawDeck = [
            { q: "What is the capital of Japan?", a: "Tokyo" },
            { q: "How many continents are there?", a: "7" },
            { q: "What is the square root of 144?", a: "12" },
            { q: "Which planet is closest to the sun?", a: "Mercury" },
            { q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" },
            { q: "What is the chemical symbol for Gold?", a: "Au" },
            { q: "What does CPU stand for?", a: "Central Processing Unit" },
            { q: "Which ocean is the largest?", a: "Pacific Ocean" },
            { q: "What is the fastest land animal?", a: "Cheetah" },
            { q: "How many colors are in a rainbow?", a: "7" },
            { q: "What is the powerhouse of the cell?", a: "Mitochondria" },
            { q: "In what year did the Titanic sink?", a: "1912" },
            { q: "What is the hardest natural substance?", a: "Diamond" },
            { q: "Which gas do plants breathe in?", a: "Carbon Dioxide" },
            { q: "What is the capital of Italy?", a: "Rome" },
            { q: "Who invented the lightbulb?", a: "Thomas Edison" },
            { q: "What is the largest organ in the human body?", a: "Skin" },
            { q: "How many bones are in the adult human body?", a: "206" },
            { q: "What is the main ingredient in hummus?", a: "Chickpeas" },
            { q: "Which country gifted the Statue of Liberty to the USA?", a: "France" }
        ];

        function playSfx(t) {
            if (!audioCtx) audioCtx = new AudioContext();
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0, audioCtx.currentTime);
            if (t === 'correct') {
                o.frequency.setValueAtTime(523, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime+0.1);
                g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime+0.01); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.2);
            } else {
                o.type='sawtooth'; o.frequency.setValueAtTime(100, audioCtx.currentTime);
                g.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime+0.01); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.3);
            }
            o.start(); o.stop(audioCtx.currentTime+0.3);
        }

        function showScreen(screenId) {
            document.querySelectorAll('.menu-card, #game-ui').forEach(s => s.style.display = 'none');
            document.getElementById(screenId).style.display = screenId === 'game-ui' ? 'flex' : 'block';
        }

        window.onload = () => {
            const savedName = localStorage.getItem('flashName');
            if(savedName) {
                userName = savedName;
                document.getElementById('user-display').innerText = userName;
                showScreen('screen-mode');
            } else {
                showScreen('screen-profile');
            }
            updateLeaderboard();
        }

        function saveProfile() {
            const val = document.getElementById('nickname-input').value.trim();
            if(!val) return alert("Enter a name!");
            userName = val;
            localStorage.setItem('flashName', userName);
            document.getElementById('user-display').innerText = userName;
            showScreen('screen-mode');
        }

        function logout() {
            localStorage.removeItem('flashName');
            location.reload();
        }

        function resetLeaderboard() {
            if(confirm("Delete all high scores?")) {
                localStorage.removeItem('flashScores');
                updateLeaderboard();
            }
        }

        function setMode(m) { gameMode = m; showScreen('screen-size'); }

        function startGame(limit) {
            isReviewMode = false;
            document.getElementById('score-label').innerText = "Current Score";
            document.getElementById('log-list').innerHTML = "";
            document.getElementById('score-text').innerText = "0";
            score = 0; currentIndex = 0; missedCards = [];
            
            showScreen('game-ui');
            if (gameMode === 'Speed') document.getElementById('timer-container').style.display = 'block';
            else document.getElementById('timer-container').style.display = 'none';
            
            currentDeck = [...rawDeck].sort(() => Math.random() - 0.5).slice(0, limit);
            updateUI();
        }

        function startTimer() {
            clearInterval(timerInterval); if (gameMode !== 'Speed') return;
            let timeLeft = 100; const bar = document.getElementById('timer-bar');
            timerInterval = setInterval(() => {
                timeLeft -= 1; bar.style.width = timeLeft + "%";
                bar.style.backgroundColor = timeLeft > 60 ? 'var(--success)' : timeLeft > 30 ? 'var(--warning)' : 'var(--danger)';
                if (timeLeft <= 0) { clearInterval(timerInterval); handleAnswer(false); }
            }, 100);
        }

        function updateUI() {
            if (currentIndex >= currentDeck.length) { showGameOver(); return; }
            document.getElementById('progress-bar-fill').style.width = (currentIndex / currentDeck.length) * 100 + "%";
            const q = document.getElementById('q-text'), a = document.getElementById('a-text');
            q.style.opacity = "0"; a.style.opacity = "0"; document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                q.innerText = currentDeck[currentIndex].q; a.innerText = currentDeck[currentIndex].a;
                document.getElementById('counter').innerText = `CARD ${currentIndex + 1} / ${currentDeck.length}`;
                q.style.opacity = "1"; a.style.opacity = "1"; lock = false;
                if(gameMode === 'Speed') startTimer();
            }, 300);
        }

        function handleAnswer(isRight) {
            if (lock) return; lock = true; clearInterval(timerInterval);
            const currentQ = currentDeck[currentIndex];
            const logItem = document.createElement('li');
            logItem.className = 'log-item' + (isRight ? ' can-open' : '');
            logItem.innerHTML = `
                <div class="log-header" ${isRight ? 'onclick="toggleAnswer(this)"' : ''}>
                    <span>${currentQ.q}</span>
                    <span class="status-icon ${isRight?'right':'wrong'}">${isRight?'✔':'✖'}</span>
                </div>
                <div class="log-answer">Answer: ${currentQ.a}</div>`;
            document.getElementById('log-list').prepend(logItem);
            
            if (isRight) {
                playSfx('correct'); score++; 
                document.getElementById('score-text').innerText = score;
                setTimeout(() => { currentIndex++; updateUI(); }, 500);
            } else {
                playSfx('wrong'); missedCards.push(currentQ); document.getElementById('card').classList.add('flipped');
                setTimeout(() => { currentIndex++; updateUI(); }, 2000);
            }
        }

        function showGameOver() {
            clearInterval(timerInterval);
            document.getElementById('progress-bar-fill').style.width = "100%";
            showScreen('screen-over');
            
            if (isReviewMode) {
                document.getElementById('over-title').innerText = "Practice Done!";
                document.getElementById('final-stats').innerText = "You reviewed your mistakes.";
                document.getElementById('retry-missed-btn').style.display = 'none';
            } else {
                saveScore(score, currentDeck.length, gameMode);
                document.getElementById('over-title').innerText = "Session Ended";
                document.getElementById('final-stats').innerText = `Result: ${score} / ${currentDeck.length}`;
                document.getElementById('retry-missed-btn').style.display = missedCards.length > 0 ? 'block' : 'none';
            }
        }

        function replayMissed() {
            isReviewMode = true;
            currentDeck = [...missedCards]; missedCards = []; currentIndex = 0; score = 0;
            document.getElementById('score-label').innerText = "Practice Mode";
            document.getElementById('log-list').innerHTML = ""; 
            document.getElementById('score-text').innerText = "0";
            showScreen('game-ui');
            updateUI();
        }

        function toggleAnswer(el) {
            const p = el.parentElement; const isOpen = p.classList.contains('open');
            document.querySelectorAll('.log-item').forEach(i => i.classList.remove('open'));
            if (!isOpen) p.classList.add('open');
        }

        function updateLeaderboard() {
            const scores = JSON.parse(localStorage.getItem('flashScores') || '[]');
            const content = document.getElementById('lb-content');
            content.innerHTML = scores.length ? '' : '<div style="font-size:0.7rem; opacity:0.4;">No records yet.</div>';
            scores.sort((a,b) => (b.score/b.total) - (a.score/a.total)).slice(0, 5).forEach((s, i) => {
                content.innerHTML += `
                    <div class="lb-entry">
                        <div class="lb-bar" style="width: ${(s.score/s.total)*100}%"></div>
                        <div style="z-index:1; font-weight:bold;">${s.name}</div>
                        <div style="z-index:1; opacity:0.7;">${s.mode}</div>
                        <div style="z-index:1; color:var(--warning); font-weight:900;">${s.score}/${s.total}</div>
                    </div>`;
            });
        }

        function saveScore(s, t, m) {
            const scores = JSON.parse(localStorage.getItem('flashScores') || '[]');
            scores.push({name: userName, score: s, total: t, mode: m});
            localStorage.setItem('flashScores', JSON.stringify(scores));
            updateLeaderboard();
        }
    </script>
</body>
</html>
