<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flashcard Pro - Game Edition</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            margin: 0; display: flex; height: 100vh; 
            background: var(--bg); color: white; overflow: hidden;
        }

        /* Sidebar Style */
        #sidebar {
            width: 300px; background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px); border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px; display: flex; flex-direction: column;
        }

        #log-list { 
            flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; font-size: 0.85rem;
        }

        .log-item { 
            padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); 
            display: flex; justify-content: space-between;
        }

        /* Main Game Area */
        #game-container {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
        }

        .progress-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.1);
        }
        #progress-bar { width: 0%; height: 100%; background: var(--success); transition: 0.3s; }

        .card { width: 400px; height: 280px; perspective: 1000px; cursor: pointer; margin-bottom: 30px; }
        .card-inner { 
            position: relative; width: 100%; height: 100%; text-align: center; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; 
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        .front, .back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; align-items: center; justify-content: center; padding: 40px; 
            border-radius: 24px; font-size: 1.5rem; font-weight: 600; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .front { background: white; color: #1e293b; }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }

        .btn-group { display: flex; gap: 15px; }
        button { 
            padding: 16px 32px; border: none; border-radius: 12px; font-weight: 700; 
            cursor: pointer; transition: all 0.2s; font-size: 1rem;
        }
        .btn-wrong { background: var(--danger); color: white; }
        .btn-right { background: var(--success); color: white; }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }

        /* Game Over */
        #game-over { 
            display: none; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); text-align: center; 
            background: white; color: #333; padding: 50px; border-radius: 30px;
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h3>Session Review</h3>
        <p id="score-text">Score: 0</p>
        <ul id="log-list"></ul>
    </aside>

    <main id="game-container">
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div id="card-wrap">
            <div id="counter" style="margin-bottom: 10px; opacity: 0.8;">Card 1 / 50</div>
            <div class="card" id="card" onclick="this.classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="front" id="q-text">Question</div>
                    <div class="back" id="a-text">Answer</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-wrong" onclick="handleAnswer(false)">❌ Incorrect</button>
                <button class="btn-right" onclick="handleAnswer(true)">✅ Correct</button>
            </div>
        </div>

        <div id="game-over">
            <h1>All Done! 🏆</h1>
            <p id="final-stats"></p>
            <button onclick="location.reload()" style="background: var(--primary); color: white;">Restart Session</button>
        </div>
    </main>

    <script>
        const rawDeck = [
            { q: "What is the capital of Japan?", a: "Tokyo" },
            { q: "How many continents are there?", a: "7" },
            { q: "What is the square root of 144?", a: "12" },
            { q: "Which planet is closest to the sun?", a: "Mercury" },
            { q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" },
            { q: "What is the chemical symbol for Gold?", a: "Au" },
            { q: "What does CPU stand for?", a: "Central Processing Unit" },
            { q: "Which ocean is the largest?", a: "Pacific Ocean" },
            { q: "What is the fastest land animal?", a: "Cheetah" },
            { q: "How many colors are in a rainbow?", a: "7" },
            { q: "What is the powerhouse of the cell?", a: "Mitochondria" },
            { q: "In what year did the Titanic sink?", a: "1912" },
            { q: "What is the hardest natural substance?", a: "Diamond" },
            { q: "Which gas do plants breathe in?", a: "Carbon Dioxide" },
            { q: "What is the capital of Italy?", a: "Rome" },
            { q: "Who invented the lightbulb?", a: "Thomas Edison" },
            { q: "What is the largest organ in the human body?", a: "Skin" },
            { q: "How many bones are in the adult human body?", a: "206" },
            { q: "What is the main ingredient in hummus?", a: "Chickpeas" },
            { q: "Which country gifted the Statue of Liberty to the USA?", a: "France" },
            { q: "What is the boiling point of water (Celsius)?", a: "100°C" },
            { q: "What is the smallest prime number?", a: "2" },
            { q: "Who was the first person to walk on the moon?", a: "Neil Armstrong" },
            { q: "What is the longest river in the world?", a: "The Nile" },
            { q: "What does URL stand for?", a: "Uniform Resource Locator" },
            { q: "Which planet has the most rings?", a: "Saturn" },
            { q: "What is the currency of the United Kingdom?", a: "Pound Sterling" },
            { q: "How many states are in the USA?", a: "50" },
            { q: "Who painted the 'Starry Night'?", a: "Vincent van Gogh" },
            { q: "What is the primary language spoken in Brazil?", a: "Portuguese" },
            { q: "What is the largest desert in the world?", a: "Antarctica" },
            { q: "How many strings does a standard guitar have?", a: "6" },
            { q: "What is the Greek god of the sea?", a: "Poseidon" },
            { q: "What is the chemical symbol for Water?", a: "H2O" },
            { q: "Which country is known as the Land of the Rising Sun?", a: "Japan" },
            { q: "What is the capital of Canada?", a: "Ottawa" },
            { q: "Who is the author of 'Harry Potter'?", a: "J.K. Rowling" },
            { q: "What is the tallest mountain in the world?", a: "Mount Everest" },
            { q: "What is 15% of 200?", a: "30" },
            { q: "Which element has the atomic number 1?", a: "Hydrogen" },
            { q: "What is the capital of Spain?", a: "Madrid" },
            { q: "How many years are in a century?", a: "100" },
            { q: "What is the largest species of shark?", a: "Whale Shark" },
            { q: "Who discovered penicillin?", a: "Alexander Fleming" },
            { q: "What is the main gas in Earth's atmosphere?", a: "Nitrogen" },
            { q: "In which city is the Eiffel Tower located?", a: "Paris" },
            { q: "What is the study of weather called?", a: "Meteorology" },
            { q: "How many degrees are in a right angle?", a: "90°" },
            { q: "What is the capital of Australia?", a: "Canberra" },
            { q: "What is the most spoken language in the world?", a: "Mandarin Chinese" }
        ];

        // Shuffle deck on load
        let deck = [...rawDeck].sort(() => Math.random() - 0.5);
        let currentIndex = 0;
        let score = 0;
        let lock = false;

        function updateUI() {
            if (currentIndex >= deck.length) {
                document.getElementById('card-wrap').style.display = 'none';
                document.getElementById('game-over').style.display = 'block';
                document.getElementById('final-stats').innerText = `You scored ${score} out of ${deck.length}!`;
                return;
            }

            document.getElementById('q-text').innerText = deck[currentIndex].q;
            document.getElementById('a-text').innerText = deck[currentIndex].a;
            document.getElementById('counter').innerText = `Card ${currentIndex + 1} / ${deck.length}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex) / deck.length) * 100}%`;
            document.getElementById('card').classList.remove('flipped');
            lock = false;
        }

        function handleAnswer(isRight) {
            if (lock) return;
            lock = true;

            const currentQ = deck[currentIndex];
            const logList = document.getElementById('log-list');
            const logItem = document.createElement('li');
            logItem.className = 'log-item';
            
            if (isRight) {
                score++;
                logItem.innerHTML = `<span>${currentQ.q}</span> <span>✅</span>`;
                document.getElementById('score-text').innerText = `Score: ${score}`;
                setTimeout(next, 600);
            } else {
                logItem.innerHTML = `<span>${currentQ.q}</span> <span>❌</span>`;
                document.getElementById('card').classList.add('flipped');
                setTimeout(next, 2000);
            }
            logList.prepend(logItem);
        }

        function next() {
            currentIndex++;
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
