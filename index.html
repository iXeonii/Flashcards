<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flashcard Study Tool</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; }
        
        /* The Card Container */
        .card {
            width: 350px; height: 200px; perspective: 1000px; cursor: pointer; margin-top: 50px;
        }

        /* The Flipping Logic */
        .card-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.6s; transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 10px;
        }

        .card.flipped .card-inner { transform: rotateY(180deg); }

        .front, .back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center; 
            padding: 20px; box-sizing: border-box; border-radius: 10px; font-size: 1.2rem;
        }

        .front { background: white; color: #333; }
        .back { background: #007bff; color: white; transform: rotateY(180deg); }

        .controls { margin-top: 20px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: #333; color: white; }
    </style>
</head>
<body>

    <h2>Flashcard Practice</h2>

    <div class="card" id="card" onclick="this.classList.toggle('flipped')">
        <div class="card-inner">
            <div class="front" id="frontText">Question loading...</div>
            <div class="back" id="backText">Answer loading...</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">Previous</button>
        <button onclick="nextCard()">Next</button>
    </div>

    <script>
        const flashcards = [
            { q: "What is the capital of France?", a: "Paris" },
            { q: "What does HTML stand for?", a: "HyperText Markup Language" },
            { q: "What is 2 + 2?", a: "4" }
        ];

        let currentIndex = 0;

        function updateCard() {
            const card = document.getElementById('card');
            card.classList.remove('flipped'); // Reset flip when changing cards
            
            setTimeout(() => {
                document.getElementById('frontText').innerText = flashcards[currentIndex].q;
                document.getElementById('backText').innerText = flashcards[currentIndex].a;
            }, 150); 
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % flashcards.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
            updateCard();
        }

        // Initialize first card
        updateCard();
    </script>
</body>
</html>
