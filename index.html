<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Pro – Studio Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #fbbf24;
            --bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; outline-color: var(--primary); }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            background: var(--bg); 
            color: white; 
            overflow: hidden; 
            user-select: none;
        }

        /* --- SIDEBAR --- */
        #sidebar { 
            width: 340px; 
            min-width: 340px; 
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(30px); 
            border-right: 1px solid var(--glass-border); 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            z-index: 10; 
        }
        
        .user-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { 
            background: var(--glass); 
            border: 1px solid var(--glass-border); 
            color: white; 
            padding: 6px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.75rem; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            gap: 5px;
        }
        .logout-btn:hover { background: var(--danger); border-color: var(--danger); }

        @keyframes pulseHint { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .hint-text { font-size: 0.75rem; text-align: center; margin-bottom: 12px; color: var(--warning); animation: pulseHint 2s infinite; font-weight: 600; }

        .score-box {
            background: var(--primary);
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 0 15px rgba(255,255,255,0.1);
            position: relative;
        }

        #streak-chip {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #log-list { flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; margin-bottom: 20px; }
        #log-list::-webkit-scrollbar { width: 4px; }
        #log-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        .log-item { margin-bottom: 10px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-border); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .log-item.can-open { cursor: pointer; }
        .log-item.can-open:hover { background: rgba(255,255,255,0.08); transform: translateX(4px); }
        .log-item.open { border-color: var(--primary); background: rgba(99, 102, 241, 0.15); box-shadow: 0 0 15px var(--primary-glow); }
        
        .log-header { padding: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; gap: 10px; }
        .status-icon.right { color: var(--success); text-shadow: 0 0 8px var(--success); }
        .status-icon.wrong { color: var(--danger); font-weight: bold; text-shadow: 0 0 8px var(--danger); }
        .log-answer { max-height: 0; padding: 0 14px; font-size: 0.8rem; background: rgba(0,0,0,0.2); transition: 0.3s ease-out; overflow: hidden; color: #cbd5e1; }
        .log-item.open .log-answer { max-height: 100px; padding: 14px; border-top: 1px solid var(--glass-border); }

        /* --- LEADERBOARD --- */
        #leaderboard { padding: 15px; background: rgba(0,0,0,0.3); border-radius: 20px; border: 1px solid var(--glass-border); }
        .lb-entry { position: relative; padding: 10px 12px; margin-bottom: 8px; border-radius: 10px; background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; overflow: hidden; }
        .lb-bar { position: absolute; left: 0; top: 0; height: 100%; background: var(--primary); opacity: 0.25; z-index: 0; transition: width 1s ease-out; }
        .reset-lb { background: none; border: none; color: var(--danger); font-size: 0.65rem; cursor: pointer; opacity: 0.5; width: 100%; text-align: center; margin-top: 8px; font-weight: bold; }
        .reset-lb:hover { opacity: 1; text-decoration: underline; }

        /* --- MAIN AREA --- */
        #game-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 40px; }
        
        .bar-wrapper { position: absolute; top: 0; left: 0; width: 100%; z-index: 100; }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.4); }
        #progress-bar-fill { width: 0%; height: 100%; background: var(--success); transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 10px var(--success); }
        #timer-container { width: 100%; height: 4px; background: rgba(255,255,255,0.05); display: none; }
        #timer-bar { width: 100%; height: 100%; background: var(--success); transition: width 0.1s linear, background-color 0.3s; }

        /* --- MENUS --- */
        .menu-card { 
            text-align: center; 
            background: white; 
            color: #1e293b; 
            padding: 40px; 
            border-radius: 32px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.5); 
            width: 420px; 
            display: none; 
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { margin: 0 0 10px 0; font-weight: 900; letter-spacing: -1px; }
        p { color: #64748b; margin-bottom: 25px; }

        .btn-mode { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 14px; 
            margin: 8px 0; 
            width: 100%; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 1rem; 
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-mode:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4); filter: brightness(1.1); }
        .btn-mode:active { transform: translateY(-1px); }
        
        .btn-back { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.85rem; margin-top: 15px; font-weight: 600; }
        .btn-back:hover { color: var(--primary); }

        /* --- FLASHCARD --- */
        .card { width: 480px; height: 320px; perspective: 1500px; cursor: pointer; margin-bottom: 30px; position: relative; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        
        .front, .back { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 40px; 
            border-radius: 32px; 
            font-size: 1.75rem; 
            font-weight: 800; 
            box-sizing: border-box; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .front { background: white; color: #1e293b; border: 1px solid #e2e8f0; }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }

        .btn-group { display: flex; gap: 20px; }
        .btn-group button { 
            padding: 20px 40px; 
            border: none; 
            border-radius: 20px; 
            font-weight: 900; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 1rem; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-wrong { background: var(--danger); color: white; }
        .btn-wrong:hover { background: #dc2626; transform: scale(1.05); }
        .btn-right { background: var(--success); color: white; }
        .btn-right:hover { background: #16a34a; transform: scale(1.05); }

        input#nickname-input { 
            padding: 15px; 
            width: 90%; 
            border-radius: 14px; 
            border: 2px solid #e2e8f0; 
            margin-bottom: 20px; 
            font-size: 1.1rem; 
            text-align: center; 
            font-weight: 600;
        }

        /* --- EXTRA ENHANCEMENTS UI --- */
        .combo-text {
            position: absolute;
            top: -40px;
            font-weight: 900;
            font-size: 2rem;
            color: var(--warning);
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
            pointer-events: none;
            z-index: 200;
            animation: comboPop 0.8s ease-out forwards;
        }
        @keyframes comboPop {
            0% { opacity: 0; transform: scale(0.5) translateY(20px); }
            50% { opacity: 1; transform: scale(1.2) translateY(-10px); }
            100% { opacity: 0; transform: scale(1) translateY(-30px); }
        }

        .summary-list { text-align: left; background: #f1f5f9; padding: 15px; border-radius: 15px; margin-top: 15px; font-size: 0.9rem; }
        .summary-list li { margin: 5px 0; color: #475569; list-style: none; display: flex; justify-content: space-between; }
        .summary-list li b { color: #1e293b; }

        #settings-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            z-index: 1000;
        }
        #settings-trigger:hover { transform: rotate(45deg); background: var(--primary); }

        #settings-popover {
            position: fixed;
            bottom: 75px;
            right: 20px;
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            width: 240px;
            display: none;
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
        }

        .settings-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; font-weight: 600; }
        
        /* Micro-animations */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .pop { animation: pop 0.3s ease-out; }
        @keyframes pop {
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="user-row">
            <span id="user-display" style="font-weight: 800; color: var(--warning); font-size: 1.1rem;">Guest</span>
            <button class="logout-btn" onclick="logout()" aria-label="Logout">Logout ⏻</button>
        </div>
                
        <div class="hint-text">Click ✔ items to review</div>

        <div class="score-box">
            <div id="score-label" style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; opacity: 0.9;">Current Score</div>
            <span id="score-text" style="font-size: 2.2rem; font-weight:900;">0</span>
            <br>
            <div id="streak-chip">Streak: 0 | Best: 0</div>
        </div>

        <ul id="log-list" role="list"></ul>

        <div id="leaderboard">
            <div style="font-weight: 900; font-size: 0.9rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                <span>🏆</span> Leaderboard
            </div>
            <div id="lb-content"></div>
            <button class="reset-lb" onclick="resetLeaderboard()" aria-label="Reset Leaderboard Records">Reset Records</button>
        </div>
    </aside>

    <main id="game-container">
        <div class="bar-wrapper">
            <div class="progress-bar-bg"><div id="progress-bar-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div></div>
            <div id="timer-container"><div id="timer-bar"></div></div>
        </div>

        <div id="screen-profile" class="menu-card">
            <h1>Studio Entry</h1>
            <p>Pick a codename for the leaderboard.</p>
            <input type="text" id="nickname-input" placeholder="Your name..." maxlength="12">
            <button class="btn-mode" onclick="saveProfile()" aria-label="Enter Studio">Enter Studio</button>
        </div>

        <div id="screen-mode" class="menu-card">
            <h1>Select Mode</h1>
            <button class="btn-mode" onclick="setMode('Normal')" aria-label="Normal Mode">Normal Mode</button>
            <button class="btn-mode" style="background: var(--warning); color: #000;" onclick="setMode('Speed')" aria-label="Speed Blitz Mode">⚡ Speed Blitz</button>
        </div>

        <div id="screen-size" class="menu-card">
            <h1>Session Size</h1>
            <p>How many cards can you handle?</p>
            <button class="btn-mode" onclick="startGame(10)" aria-label="Start Sprint Session">Sprint (10)</button>
            <button class="btn-mode" onclick="startGame(50)" aria-label="Start Marathon Session">Marathon (50)</button>
            <button class="btn-back" onclick="showScreen('screen-mode')">← Change Mode</button>
        </div>
                
        <div id="game-ui" style="display: none; flex-direction: column; align-items: center;">
            <div id="counter" style="margin-bottom: 20px; font-weight: 900; background: rgba(255,255,255,0.1); padding: 6px 18px; border-radius: 20px; font-size: 0.8rem; letter-spacing: 1px; border: 1px solid var(--glass-border);">CARD 1</div>
            
            <div class="card" id="card" onclick="flipCard()">
                <div class="card-inner">
                    <div class="front" id="q-text"></div>
                    <div class="back" id="a-text"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-wrong" onclick="handleAnswer(false)" aria-label="Mark as missed">❌ Miss</button>
                <button class="btn-right" onclick="handleAnswer(true)" aria-label="Mark as correct">✅ Got It</button>
            </div>
        </div>

        <div id="screen-over" class="menu-card">
            <h1 id="over-title">Finished!</h1>
            <p id="final-stats" style="font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; color: var(--primary);"></p>
            
            <div id="summary-details"></div>

            <button id="retry-missed-btn" class="btn-mode" style="background: var(--danger); margin-top: 20px;" onclick="replayMissed()">Review Mistakes</button>
            <button class="btn-mode" onclick="showScreen('screen-mode')">Main Menu</button>
        </div>
    </main>

    <button id="settings-trigger" onclick="toggleSettings()" aria-label="Settings">⚙</button>
    <div id="settings-popover">
        <h3 style="margin-top:0; font-size: 1rem;">Preferences</h3>
        <div class="settings-row">
            <span>Sound Effects</span>
            <input type="checkbox" id="set-sfx" checked onchange="saveSettings()">
        </div>
        <div class="settings-row">
            <span>Timer Auto-Fail</span>
            <input type="checkbox" id="set-autofail" checked onchange="saveSettings()">
        </div>
        <button class="btn-back" style="width: 100%;" onclick="toggleSettings()">Close</button>
    </div>

    <script>
        /**
         * FLASHCARD PRO - CORE DATA
         */
        let audioCtx, currentDeck = [], missedCards = [], gameMode = 'Normal', 
            currentIndex = 0, score = 0, lock = false, timerInterval, 
            isReviewMode = false, userName = "";

        // Performance & Enhancements Data
        let currentStreak = 0;
        let bestStreak = 0;
        let appSettings = { sfx: true, autofail: true };

        const rawDeck = [
            { q: "What is the capital of Japan?", a: "Tokyo" },
            { q: "How many continents are there?", a: "7" },
            { q: "What is the square root of 144?", a: "12" },
            { q: "Which planet is closest to the sun?", a: "Mercury" },
            { q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" },
            { q: "What is the chemical symbol for Gold?", a: "Au" },
            { q: "What does CPU stand for?", a: "Central Processing Unit" },
            { q: "Which ocean is the largest?", a: "Pacific Ocean" },
            { q: "What is the fastest land animal?", a: "Cheetah" },
            { q: "How many colors are in a rainbow?", a: "7" },
            { q: "What is the powerhouse of the cell?", a: "Mitochondria" },
            { q: "In what year did the Titanic sink?", a: "1912" },
            { q: "What is the hardest natural substance?", a: "Diamond" },
            { q: "Which gas do plants breathe in?", a: "Carbon Dioxide" },
            { q: "What is the capital of Italy?", a: "Rome" },
            { q: "Who invented the lightbulb?", a: "Thomas Edison" },
            { q: "What is the largest organ in the human body?", a: "Skin" },
            { q: "How many bones are in the adult human body?", a: "206" },
            { q: "What is the main ingredient in hummus?", a: "Chickpeas" },
            { q: "Which country gifted the Statue of Liberty to the USA?", a: "France" }
        ];

        /**
         * INITIALIZATION & PERSISTENCE
         */
        window.onload = () => {
            const savedName = localStorage.getItem('flashName');
            const savedSettings = localStorage.getItem('flashSettings');
            
            if(savedSettings) {
                appSettings = JSON.parse(savedSettings);
                document.getElementById('set-sfx').checked = appSettings.sfx;
                document.getElementById('set-autofail').checked = appSettings.autofail;
            }

            if(savedName) {
                userName = savedName;
                document.getElementById('user-display').innerText = userName;
                showScreen('screen-mode');
            } else {
                showScreen('screen-profile');
            }
            updateLeaderboard();
        };

        function saveProfile() {
            const val = document.getElementById('nickname-input').value.trim();
            if(!val) return alert("Please enter a nickname to proceed!");
            userName = val;
            localStorage.setItem('flashName', userName);
            document.getElementById('user-display').innerText = userName;
            showScreen('screen-mode');
        }

        function logout() {
            if(confirm("Logout and clear profile?")) {
                localStorage.removeItem('flashName');
                location.reload();
            }
        }

        /**
         * AUDIO SYSTEM (Web Audio API)
         */
        function playSfx(t) {
            if (!appSettings.sfx) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination); 
            g.gain.setValueAtTime(0, audioCtx.currentTime);

            if (t === 'correct') {
                o.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                o.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); // A5
                g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.01);
                g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            } else {
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(120, audioCtx.currentTime);
                o.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.2);
                g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.01);
                g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            }
            o.start(); o.stop(audioCtx.currentTime + 0.3);
        }

        /**
         * CORE NAVIGATION
         */
        function showScreen(screenId) {
            document.querySelectorAll('.menu-card, #game-ui').forEach(s => s.style.display = 'none');
            const target = document.getElementById(screenId);
            if (screenId === 'game-ui') target.style.display = 'flex';
            else target.style.display = 'block';
        }

        function setMode(m) { gameMode = m; showScreen('screen-size'); }

        /**
         * GAME LOGIC
         */
        function startGame(limit) {
            isReviewMode = false;
            currentStreak = 0;
            bestStreak = 0;
            updateStreakUI();

            document.getElementById('score-label').innerText = "Current Score";
            document.getElementById('log-list').innerHTML = "";
            document.getElementById('score-text').innerText = "0";
            
            score = 0; 
            currentIndex = 0; 
            missedCards = [];
            
            showScreen('game-ui');
            
            if (gameMode === 'Speed') document.getElementById('timer-container').style.display = 'block';
            else document.getElementById('timer-container').style.display = 'none';
            
            currentDeck = [...rawDeck].sort(() => Math.random() - 0.5).slice(0, limit);
            updateUI();
        }

        function updateUI() {
            if (currentIndex >= currentDeck.length) { showGameOver(); return; }
            
            // Progress Update
            const prog = (currentIndex / currentDeck.length) * 100;
            document.getElementById('progress-bar-fill').style.width = prog + "%";
            
            const q = document.getElementById('q-text'), 
                  a = document.getElementById('a-text'),
                  card = document.getElementById('card');
            
            q.style.opacity = "0"; a.style.opacity = "0"; 
            card.classList.remove('flipped');

            setTimeout(() => {
                q.innerText = currentDeck[currentIndex].q; 
                a.innerText = currentDeck[currentIndex].a;
                document.getElementById('counter').innerText = `CARD ${currentIndex + 1} / ${currentDeck.length}`;
                q.style.opacity = "1"; a.style.opacity = "1"; 
                lock = false;
                if(gameMode === 'Speed') startTimer();
            }, 300);
        }

        function startTimer() {
            clearInterval(timerInterval); 
            if (gameMode !== 'Speed') return;
            
            let timeLeft = 100; 
            const bar = document.getElementById('timer-bar');
            bar.style.width = "100%";
            bar.style.backgroundColor = 'var(--success)';

            timerInterval = setInterval(() => {
                timeLeft -= 1; 
                bar.style.width = timeLeft + "%";
                
                if (timeLeft > 60) bar.style.backgroundColor = 'var(--success)';
                else if (timeLeft > 30) bar.style.backgroundColor = 'var(--warning)';
                else bar.style.backgroundColor = 'var(--danger)';

                if (timeLeft <= 0) { 
                    clearInterval(timerInterval); 
                    if (appSettings.autofail) handleAnswer(false); 
                }
            }, 100);
        }

        function handleAnswer(isRight) {
            if (lock) return; 
            lock = true; 
            clearInterval(timerInterval);
            
            const currentQ = currentDeck[currentIndex];
            const cardEl = document.getElementById('card');

            // Log entry creation
            const logItem = document.createElement('li');
            logItem.className = 'log-item' + (isRight ? ' can-open' : '');
            logItem.innerHTML = `
                <div class="log-header" ${isRight ? 'onclick="toggleAnswer(this)"' : ''}>
                    <span>${currentQ.q}</span>
                    <span class="status-icon ${isRight?'right':'wrong'}">${isRight?'✔':'✖'}</span>
                </div>
                <div class="log-answer"><b>Answer:</b> ${currentQ.a}</div>`;
            document.getElementById('log-list').prepend(logItem);
            
            if (isRight) {
                playSfx('correct'); 
                score++; 
                currentStreak++;
                if (currentStreak > bestStreak) bestStreak = currentStreak;
                
                cardEl.classList.add('pop');
                checkComboFeedback();
                
                document.getElementById('score-text').innerText = score;
                setTimeout(() => { 
                    cardEl.classList.remove('pop');
                    currentIndex++; 
                    updateUI(); 
                }, 500);
            } else {
                playSfx('wrong'); 
                currentStreak = 0;
                missedCards.push(currentQ); 
                
                cardEl.classList.add('shake', 'flipped');
                setTimeout(() => { 
                    cardEl.classList.remove('shake');
                    currentIndex++; 
                    updateUI(); 
                }, 2000);
            }
            updateStreakUI();
        }

        /**
         * ENHANCEMENT: COMBO & STREAKS
         */
        function updateStreakUI() {
            document.getElementById('streak-chip').innerText = `Streak: ${currentStreak} | Best: ${bestStreak}`;
        }

        function checkComboFeedback() {
            let msg = "";
            if (currentStreak === 3) msg = "Nice! 🔥";
            if (currentStreak === 5) msg = "On Fire!! ⚡";
            if (currentStreak >= 10 && currentStreak % 5 === 0) msg = "UNSTOPPABLE! 🏆";

            if (msg) {
                const combo = document.createElement('div');
                combo.className = 'combo-text';
                combo.innerText = msg;
                document.getElementById('game-container').appendChild(combo);
                setTimeout(() => combo.remove(), 800);
            }
        }

        /**
         * GAME OVER & SUMMARY
         */
        function showGameOver() {
            clearInterval(timerInterval);
            document.getElementById('progress-bar-fill').style.width = "100%";
            showScreen('screen-over');
            
            const summaryDiv = document.getElementById('summary-details');
            summaryDiv.innerHTML = "";

            if (isReviewMode) {
                document.getElementById('over-title').innerText = "Practice Done!";
                document.getElementById('final-stats').innerText = "Review complete.";
                document.getElementById('retry-missed-btn').style.display = 'none';
            } else {
                saveScore(score, currentDeck.length, gameMode);
                document.getElementById('over-title').innerText = "Session Ended";
                document.getElementById('final-stats').innerText = `Result: ${score} / ${currentDeck.length}`;
                
                // Enhancement: Detailed Summary
                const pct = Math.round((score / currentDeck.length) * 100);
                summaryDiv.innerHTML = `
                    <ul class="summary-list">
                        <li><span>Accuracy</span> <b>${pct}%</b></li>
                        <li><span>Total Missed</span> <b>${missedCards.length}</b></li>
                        <li><span>Longest Streak</span> <b>${bestStreak}</b></li>
                        <li><span>Mode</span> <b>${gameMode}</b></li>
                    </ul>`;
                
                document.getElementById('retry-missed-btn').style.display = missedCards.length > 0 ? 'block' : 'none';
            }
        }

        function replayMissed() {
            isReviewMode = true;
            currentDeck = [...missedCards]; 
            missedCards = []; 
            currentIndex = 0; 
            score = 0;
            currentStreak = 0;
            updateStreakUI();

            document.getElementById('score-label').innerText = "Practice Mode";
            document.getElementById('log-list').innerHTML = ""; 
            document.getElementById('score-text').innerText = "0";
            showScreen('game-ui');
            updateUI();
        }

        /**
         * SETTINGS & UTILITIES
         */
        function toggleSettings() {
            const pop = document.getElementById('settings-popover');
            pop.style.display = pop.style.display === 'block' ? 'none' : 'block';
        }

        function saveSettings() {
            appSettings.sfx = document.getElementById('set-sfx').checked;
            appSettings.autofail = document.getElementById('set-autofail').checked;
            localStorage.setItem('flashSettings', JSON.stringify(appSettings));
        }

        function flipCard() {
            if (lock && !document.getElementById('card').classList.contains('flipped')) return;
            document.getElementById('card').classList.toggle('flipped');
        }

        function toggleAnswer(el) {
            const p = el.parentElement; 
            const isOpen = p.classList.contains('open');
            document.querySelectorAll('.log-item').forEach(i => i.classList.remove('open'));
            if (!isOpen) p.classList.add('open');
        }

        function updateLeaderboard() {
            const scores = JSON.parse(localStorage.getItem('flashScores') || '[]');
            const content = document.getElementById('lb-content');
            content.innerHTML = scores.length ? '' : '<div style="font-size:0.7rem; opacity:0.4; text-align:center; padding: 10px;">No records yet.</div>';
            
            scores.sort((a,b) => (b.score/b.total) - (a.score/a.total)).slice(0, 5).forEach((s) => {
                const pct = (s.score / s.total) * 100;
                content.innerHTML += `
                    <div class="lb-entry">
                        <div class="lb-bar" style="width: ${pct}%"></div>
                        <div style="z-index:1; font-weight:800;">${s.name}</div>
                        <div style="z-index:1; opacity:0.6; font-size: 0.6rem;">${s.mode.toUpperCase()}</div>
                        <div style="z-index:1; color:var(--warning); font-weight:900;">${s.score}/${s.total}</div>
                    </div>`;
            });
        }

        function saveScore(s, t, m) {
            const scores = JSON.parse(localStorage.getItem('flashScores') || '[]');
            scores.push({name: userName, score: s, total: t, mode: m});
            localStorage.setItem('flashScores', JSON.stringify(scores));
            updateLeaderboard();
        }

        function resetLeaderboard() {
            if(confirm("Are you sure you want to delete all high scores? This cannot be undone.")) {
                localStorage.removeItem('flashScores');
                updateLeaderboard();
            }
        }
    </script>
</body>
</html>
