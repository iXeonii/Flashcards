<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Pro - Studio Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #fbbf24;
            --bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; outline-color: var(--primary); }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background: var(--bg);
            color: white;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: 340px;
            min-width: 340px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logout-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logout-btn:hover { background: var(--danger); transform: scale(1.05); }

        @keyframes pulseHint { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .hint-text {
            font-size: 0.75rem;
            text-align: center;
            margin-bottom: 10px;
            color: var(--warning);
            animation: pulseHint 2s infinite;
        }

        .score-box {
            background: var(--primary);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px var(--primary-glow);
            position: relative;
        }

        #streak-chip {
            position: absolute;
            top: -10px;
            right: -5px;
            background: var(--warning);
            color: #000;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 900;
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #log-list {
            flex-grow: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            scrollbar-width: thin;
        }

        .log-item {
            margin-bottom: 8px;
            border-radius: 12px;
            background: var(--glass);
            overflow: hidden;
            border: 2px solid transparent;
            transition: 0.2s ease;
        }

        .log-item.can-open { cursor: pointer; }
        .log-item.can-open:hover { background: rgba(255,255,255,0.1); }
        .log-item.open { border-color: var(--primary); background: rgba(99, 102, 241, 0.15); }

        .log-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .status-icon.right { color: var(--success); }
        .status-icon.wrong { color: var(--danger); font-weight: bold; }

        .log-answer {
            max-height: 0;
            padding: 0 12px;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.2);
            transition: 0.3s;
            overflow: hidden;
        }
        .log-item.open .log-answer { max-height: 100px; padding: 12px; border-top: 1px solid var(--glass-border); }

        /* --- LEADERBOARD --- */
        #leaderboard {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .lb-entry {
            position: relative;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            overflow: hidden;
        }

        .lb-bar { position: absolute; left: 0; top: 0; height: 100%; background: var(--primary); opacity: 0.2; z-index: 0; }
        .reset-lb { background: none; border: none; color: #ff4444; font-size: 0.6rem; cursor: pointer; opacity: 0.5; width: 100%; text-align: center; margin-top: 5px; }

        /* --- MAIN AREA --- */
        #game-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .bar-wrapper { position: absolute; top: 0; left: 0; width: 100%; z-index: 100; }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.3); }
        #progress-bar-fill { width: 0%; height: 100%; background: var(--success); transition: width 0.4s ease; box-shadow: 0 0 10px var(--success); }
        #timer-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); display: none; }
        #timer-bar { width: 100%; height: 100%; background: var(--success); transition: width 0.1s linear; }

        /* --- MENUS --- */
        .menu-card {
            text-align: center;
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            width: 420px;
            display: none;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .btn-mode {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            margin: 8px 0;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-mode:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-back { background: none; border: none; color: #888; cursor: pointer; font-size: 0.8rem; margin-top: 10px; text-decoration: underline; }

        /* --- CARD --- */
        .card { width: 420px; height: 300px; perspective: 1000px; cursor: pointer; margin-bottom: 25px; position: relative; }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border-radius: 28px;
            font-size: 1.6rem;
            font-weight: 700;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .front { background: white; color: #1e293b; border: 1px solid #e2e8f0; }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }

        /* --- COMBO FEEDBACK --- */
        .combo-msg {
            position: absolute;
            top: -40px;
            font-weight: 900;
            color: var(--warning);
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            pointer-events: none;
            z-index: 100;
        }

        /* --- BUTTONS --- */
        .btn-group button { padding: 18px 35px; border: none; border-radius: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; margin: 0 10px; }
        .btn-wrong { background: var(--danger); color: white; }
        .btn-right { background: var(--success); color: white; }
        .btn-wrong:hover, .btn-right:hover { transform: scale(1.05); }

        input#nickname-input, .deck-input { padding: 12px; width: 80%; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; font-size: 1rem; text-align: center; }

        /* --- DECK BUILDER --- */
        #deck-list-container { max-height: 200px; overflow-y: auto; margin: 10px 0; border: 1px solid #eee; border-radius: 10px; padding: 5px; }
        .deck-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; font-size: 0.9rem; align-items: center; }
        .deck-item.active-selection { border-left: 4px solid var(--primary); background: rgba(99, 102, 241, 0.05); }
        .deck-actions { display: flex; gap: 5px; }
        .small-btn { padding: 4px 8px; font-size: 0.7rem; border-radius: 5px; border: none; cursor: pointer; }

        /* --- SETTINGS POP OVER --- */
        #settings-btn { position: absolute; bottom: 20px; right: 20px; background: var(--glass); border: 1px solid var(--glass-border); color: white; padding: 10px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
        #settings-btn:hover { transform: rotate(90deg); background: var(--primary); }
        #settings-popover {
            position: absolute; bottom: 70px; right: 20px; background: white; color: #333; padding: 20px; border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: none; width: 200px; z-index: 1000;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.8rem; font-weight: bold; }

        /* --- ANIMATIONS --- */
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        @keyframes successPop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .shake { animation: shake 0.2s ease-in-out 0s 2; }
        .pop { animation: successPop 0.3s ease-out; }

    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="user-row">
            <span id="user-display" style="font-weight: 900; color: var(--warning); font-size: 1.1rem;">Guest</span>
            <button class="logout-btn" onclick="logout()" aria-label="Logout">Logout ⏻</button>
        </div>
        <div class="hint-text">Click ✔ items to review</div>
        
        <div class="score-box">
            <div id="streak-chip">STREAK: 0</div>
            <div id="score-label" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8;">Current Score</div>
            <span id="score-text" style="font-size: 2rem; font-weight:900;">0</span>
        </div>

        <ul id="log-list"></ul>

        <div id="leaderboard">
            <div style="font-weight: 800; font-size: 0.9rem; margin-bottom: 10px; display: flex; align-items: center; gap: 5px;">🏆 Leaderboard</div>
            <div id="lb-content"></div>
            <button class="reset-lb" onclick="resetLeaderboard()" aria-label="Reset Leaderboard">Reset Records</button>
        </div>
    </aside>

    <main id="game-container">
        <div class="bar-wrapper">
            <div class="progress-bar-bg"><div id="progress-bar-fill"></div></div>
            <div id="timer-container"><div id="timer-bar"></div></div>
        </div>

        <div id="screen-profile" class="menu-card">
            <h1>New Player</h1>
            <p>Enter your studio nickname:</p>
            <input type="text" id="nickname-input" placeholder="Nickname..." maxlength="12">
            <button class="btn-mode" onclick="saveProfile()">Enter Studio</button>
        </div>

        <div id="screen-mode" class="menu-card">
            <h1>Game Mode</h1>
            <button class="btn-mode" onclick="setMode('Normal')" aria-label="Normal Mode">Normal Mode</button>
            <button class="btn-mode" style="background: var(--warning); color: #000;" onclick="setMode('Speed')" aria-label="Speed Blitz Mode">⚡ Speed Blitz</button>
            <hr style="margin: 15px 0; opacity: 0.1;">
            <button class="btn-mode" style="background: #444;" onclick="showScreen('screen-decks')">🗂 Manage Decks</button>
        </div>

        <div id="screen-decks" class="menu-card">
            <h2>Your Decks</h2>
            <div id="deck-list-container"></div>
            <button class="btn-mode" style="background: var(--success);" onclick="showDeckEditor()">+ Create New Deck</button>
            <button class="btn-back" onclick="showScreen('screen-mode')">Back to Modes</button>
        </div>

        <div id="screen-deck-editor" class="menu-card" style="width: 500px;">
            <h2 id="editor-title">Create Deck</h2>
            <input type="text" id="deck-name-input" placeholder="Deck Name" class="deck-input">
            <div id="cards-editor-area" style="max-height: 250px; overflow-y: auto; margin-bottom: 10px; padding-right: 5px;">
                </div>
            <button class="small-btn" style="background: #eee; width: 100%; margin-bottom: 10px;" onclick="addEditorRow()">+ Add Card</button>
            <button class="btn-mode" onclick="saveCustomDeck()">Save Deck</button>
            <button class="btn-back" onclick="showScreen('screen-decks')">Cancel</button>
        </div>

        <div id="screen-size" class="menu-card">
            <h1 id="size-title">Session Size</h1>
            <button class="btn-mode" onclick="startGame(10)">Sprint (10)</button>
            <button class="btn-mode" onclick="startGame(50)">Marathon (50)</button>
            <button class="btn-back" onclick="showScreen('screen-mode')">← Change Mode</button>
        </div>

        <div id="game-ui" style="display: none; flex-direction: column; align-items: center;">
            <div id="counter" style="margin-bottom: 15px; font-weight: 800; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; letter-spacing: 1px;">CARD 1</div>
            
            <div class="card" id="card" onclick="toggleFlip()">
                <div id="combo-popup" class="combo-msg" style="display:none;">COMBO!</div>
                <div class="card-inner">
                    <div class="front" id="q-text"></div>
                    <div class="back" id="a-text"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-wrong" onclick="handleAnswer(false)" aria-label="Missed it">❌ Miss</button>
                <button class="btn-right" onclick="handleAnswer(true)" aria-label="Got it right">✅ Got It</button>
            </div>
        </div>

        <div id="screen-over" class="menu-card">
            <h1 id="over-title" style="margin-bottom: 5px;">Finished!</h1>
            <p id="final-stats" style="font-size: 1.4rem; font-weight: 900; color: var(--primary); margin-bottom: 10px;"></p>
            
            <div id="extra-stats" style="text-align: left; background: #f8fafc; padding: 15px; border-radius: 15px; margin-bottom: 20px; font-size: 0.85rem; border: 1px solid #e2e8f0;">
                </div>

            <button id="retry-missed-btn" class="btn-mode" style="background: var(--danger);" onclick="replayMissed()">Review Mistakes</button>
            <button class="btn-mode" onclick="showScreen('screen-mode')">Main Menu</button>
        </div>

        <button id="settings-btn" onclick="toggleSettings()" title="Settings">⚙</button>
        <div id="settings-popover">
            <div class="setting-row">
                <span>Sound Effects</span>
                <input type="checkbox" id="setting-sfx" checked onchange="updateSettings()">
            </div>
            <div class="setting-row">
                <span>Speed Auto-Fail</span>
                <input type="checkbox" id="setting-autofail" checked onchange="updateSettings()">
            </div>
        </div>
    </main>

    <script>
        /**
         * GLOBAL STATE
         */
        let audioCtx, currentDeck = [], missedCards = [], gameMode = 'Normal', currentIndex = 0, score = 0, lock = false, timerInterval, isReviewMode = false, userName = "";
        let activeDeckId = 'standard'; // Tracks currently used deck
        let currentStreak = 0, bestStreak = 0;
        let settings = { sfx: true, autofail: true };

        const rawDeck = [
            { q: "What is the capital of Japan?", a: "Tokyo" }, { q: "How many continents are there?", a: "7" },
            { q: "What is the square root of 144?", a: "12" }, { q: "Which planet is closest to the sun?", a: "Mercury" },
            { q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" }, { q: "What is the chemical symbol for Gold?", a: "Au" },
            { q: "What does CPU stand for?", a: "Central Processing Unit" }, { q: "Which ocean is the largest?", a: "Pacific Ocean" },
            { q: "What is the fastest land animal?", a: "Cheetah" }, { q: "How many colors are in a rainbow?", a: "7" },
            { q: "What is the powerhouse of the cell?", a: "Mitochondria" }, { q: "In what year did the Titanic sink?", a: "1912" },
            { q: "What is the hardest natural substance?", a: "Diamond" }, { q: "Which gas do plants breathe in?", a: "Carbon Dioxide" },
            { q: "What is the capital of Italy?", a: "Rome" }, { q: "Who invented the lightbulb?", a: "Thomas Edison" },
            { q: "What is the largest organ in the human body?", a: "Skin" }, { q: "How many bones are in the adult human body?", a: "206" },
            { q: "What is the main ingredient in hummus?", a: "Chickpeas" }, { q: "Which country gifted the Statue of Liberty to the USA?", a: "France" }
        ];

        /**
         * INITIALIZATION
         */
        window.onload = () => {
            const savedName = localStorage.getItem('flashName');
            const savedSettings = localStorage.getItem('flashSettings');
            
            if(savedSettings) {
                try {
                    settings = JSON.parse(savedSettings);
                    document.getElementById('setting-sfx').checked = settings.sfx;
                    document.getElementById('setting-autofail').checked = settings.autofail;
                } catch(e) { console.error("Settings corrupted"); }
            }

            if(savedName) {
                userName = savedName;
                document.getElementById('user-display').innerText = userName;
                showScreen('screen-mode');
            } else {
                showScreen('screen-profile');
            }
            updateLeaderboard();
            renderDeckList();
        };

        /**
         * AUDIO SYSTEM
         */
        function playSfx(t) {
            if (!settings.sfx) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                g.gain.setValueAtTime(0, audioCtx.currentTime);

                if (t === 'correct') {
                    o.frequency.setValueAtTime(523, audioCtx.currentTime);
                    o.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime+0.1);
                    g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime+0.01);
                    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.2);
                } else {
                    o.type = 'sawtooth';
                    o.frequency.setValueAtTime(120, audioCtx.currentTime);
                    g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime+0.01);
                    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.4);
                }
                o.start(); o.stop(audioCtx.currentTime+0.4);
            } catch(e) { console.log("Audio play blocked"); }
        }

        /**
         * PERSISTENCE & DECK MANAGEMENT
         */
        function getCustomDecks() {
            try {
                const stored = localStorage.getItem('flashCustomDecks');
                const decks = stored ? JSON.parse(stored) : [];
                // Validate structure: must be an array of objects with cards array
                return Array.isArray(decks) ? decks.filter(d => d && d.name && Array.isArray(d.cards)) : [];
            } catch(e) {
                console.error("Corrupted deck storage");
                return [];
            }
        }

        function renderDeckList() {
            const container = document.getElementById('deck-list-container');
            const decks = getCustomDecks();
            
            // Render Standard
            let html = `
                <div class="deck-item ${activeDeckId === 'standard' ? 'active-selection' : ''}">
                    <span style="font-weight:900;">Standard Studio Deck</span>
                    <button class="small-btn" style="background:var(--primary); color:white" onclick="selectDeck('standard')">Use</button>
                </div>`;
            
            // Render Custom
            decks.forEach((deck, index) => {
                const id = `custom-${index}`;
                html += `
                    <div class="deck-item ${activeDeckId === id ? 'active-selection' : ''}">
                        <span style="font-weight:bold">${deck.name} (${deck.cards.length})</span>
                        <div class="deck-actions">
                            <button class="small-btn" style="background:var(--primary); color:white" onclick="selectDeck('${id}')">Use</button>
                            <button class="small-btn" style="background:#ddd" onclick="showDeckEditor(${index})">Edit</button>
                            <button class="small-btn" style="background:var(--danger); color:white" onclick="deleteDeck(${index})">×</button>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        function selectDeck(id) {
            activeDeckId = id;
            renderDeckList();
            showScreen('screen-mode');
        }

        function deleteDeck(index) {
            if(!confirm("Delete this deck permanently?")) return;
            const decks = getCustomDecks();
            decks.splice(index, 1);
            localStorage.setItem('flashCustomDecks', JSON.stringify(decks));
            
            // If deleting the active deck, reset to standard
            if (activeDeckId === `custom-${index}`) activeDeckId = 'standard';
            
            renderDeckList();
        }

        let editingIndex = -1;
        function showDeckEditor(index = -1) {
            editingIndex = index;
            const area = document.getElementById('cards-editor-area');
            const nameInput = document.getElementById('deck-name-input');
            area.innerHTML = '';
            
            if (index === -1) {
                document.getElementById('editor-title').innerText = "Create Deck";
                nameInput.value = "";
                addEditorRow();
            } else {
                const deck = getCustomDecks()[index];
                document.getElementById('editor-title').innerText = "Edit Deck";
                nameInput.value = deck.name;
                deck.cards.forEach(c => addEditorRow(c.q, c.a));
            }
            showScreen('screen-deck-editor');
        }

        function addEditorRow(q = "", a = "") {
            const div = document.createElement('div');
            div.style.display = "flex"; div.style.gap = "5px"; div.style.marginBottom = "5px";
            div.innerHTML = `
                <input type="text" placeholder="Question" class="deck-input q-val" style="margin:0; flex:1" value="${q.replace(/"/g, '&quot;')}">
                <input type="text" placeholder="Answer" class="deck-input a-val" style="margin:0; flex:1" value="${a.replace(/"/g, '&quot;')}">
                <button class="small-btn" style="background:var(--danger); color:white" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('cards-editor-area').appendChild(div);
        }

        function saveCustomDeck() {
            const name = document.getElementById('deck-name-input').value.trim();
            if(!name) return alert("Please enter a deck name.");
            
            const cards = [];
            const qNodes = document.querySelectorAll('.q-val');
            const aNodes = document.querySelectorAll('.a-val');
            
            qNodes.forEach((node, i) => {
                const qV = node.value.trim();
                const aV = aNodes[i].value.trim();
                if(qV && aV) cards.push({ q: qV, a: aV });
            });

            if(cards.length === 0) return alert("Deck must have at least one valid card (Question + Answer).");

            const decks = getCustomDecks();
            const payload = { name, cards };

            if(editingIndex === -1) decks.push(payload);
            else decks[editingIndex] = payload;

            localStorage.setItem('flashCustomDecks', JSON.stringify(decks));
            renderDeckList();
            showScreen('screen-decks');
        }

        /**
         * GAME FLOW & UI
         */
        function showScreen(id) {
            document.querySelectorAll('.menu-card, #game-ui').forEach(s => s.style.display = 'none');
            const el = document.getElementById(id);
            if(el) el.style.display = (id === 'game-ui') ? 'flex' : 'block';
        }

        function saveProfile() {
            const val = document.getElementById('nickname-input').value.trim();
            if(!val) return;
            userName = val;
            localStorage.setItem('flashName', userName);
            document.getElementById('user-display').innerText = userName;
            showScreen('screen-mode');
        }

        function logout() {
            localStorage.removeItem('flashName');
            location.reload();
        }

        function toggleSettings() {
            const p = document.getElementById('settings-popover');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function updateSettings() {
            settings.sfx = document.getElementById('setting-sfx').checked;
            settings.autofail = document.getElementById('setting-autofail').checked;
            localStorage.setItem('flashSettings', JSON.stringify(settings));
        }

        function setMode(m) {
            gameMode = m;
            showScreen('screen-size');
        }

        function startGame(limit) {
            isReviewMode = false;
            currentStreak = 0; bestStreak = 0; score = 0; currentIndex = 0; missedCards = [];
            
            document.getElementById('score-label').innerText = "Current Score";
            document.getElementById('log-list').innerHTML = "";
            document.getElementById('score-text').innerText = "0";
            document.getElementById('streak-chip').style.display = 'none';
            document.getElementById('timer-container').style.display = (gameMode === 'Speed') ? 'block' : 'none';
            
            // Load correct deck source
            let source = rawDeck;
            if(activeDeckId.startsWith('custom-')) {
                const idx = parseInt(activeDeckId.split('-')[1]);
                const customDecks = getCustomDecks();
                if(customDecks[idx]) source = customDecks[idx].cards;
            }

            if(!source || source.length === 0) {
                alert("This deck is empty!");
                showScreen('screen-mode');
                return;
            }

            currentDeck = [...source].sort(() => Math.random() - 0.5).slice(0, limit);
            showScreen('game-ui');
            updateUI();
        }

        function updateUI() {
            if (currentIndex >= currentDeck.length) {
                showGameOver();
                return;
            }
            
            const progress = (currentIndex / currentDeck.length) * 100;
            document.getElementById('progress-bar-fill').style.width = progress + "%";
            
            const q = document.getElementById('q-text'), a = document.getElementById('a-text');
            const card = document.getElementById('card');
            
            q.style.opacity = "0"; a.style.opacity = "0";
            card.classList.remove('flipped', 'shake', 'pop');
            
            setTimeout(() => {
                q.innerText = currentDeck[currentIndex].q;
                a.innerText = currentDeck[currentIndex].a;
                document.getElementById('counter').innerText = `CARD ${currentIndex + 1} / ${currentDeck.length}`;
                q.style.opacity = "1"; a.style.opacity = "1";
                lock = false;
                if(gameMode === 'Speed') startTimer();
            }, 300);
        }

        function startTimer() {
            clearInterval(timerInterval);
            if (gameMode !== 'Speed') return;
            let timeLeft = 100;
            const bar = document.getElementById('timer-bar');
            timerInterval = setInterval(() => {
                timeLeft -= 1;
                bar.style.width = timeLeft + "%";
                bar.style.backgroundColor = timeLeft > 60 ? 'var(--success)' : timeLeft > 30 ? 'var(--warning)' : 'var(--danger)';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (settings.autofail) handleAnswer(false);
                }
            }, 100);
        }

        function toggleFlip() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function handleAnswer(isRight) {
            if (lock) return;
            lock = true;
            clearInterval(timerInterval);
            
            const card = currentDeck[currentIndex];
            const logItem = document.createElement('li');
            logItem.className = 'log-item' + (isRight ? ' can-open' : '');
            logItem.innerHTML = `
                <div class="log-header" ${isRight ? 'onclick="toggleAnswer(this)"' : ''}>
                    <span>${card.q}</span>
                    <span class="status-icon ${isRight?'right':'wrong'}">${isRight?'✔':'✖'}</span>
                </div>
                <div class="log-answer">Answer: ${card.a}</div>`;
            document.getElementById('log-list').prepend(logItem);

            const cardEl = document.getElementById('card');
            if (isRight) {
                playSfx('correct');
                score++;
                currentStreak++;
                if(currentStreak > bestStreak) bestStreak = currentStreak;
                
                cardEl.classList.add('pop');
                document.getElementById('score-text').innerText = score;
                const chip = document.getElementById('streak-chip');
                chip.innerText = `STREAK: ${currentStreak}`;
                chip.style.display = 'block';

                if([3, 5, 10, 25, 50].includes(currentStreak)) triggerCombo();

                setTimeout(() => { currentIndex++; updateUI(); }, 500);
            } else {
                playSfx('wrong');
                currentStreak = 0;
                document.getElementById('streak-chip').style.display = 'none';
                missedCards.push(card);
                cardEl.classList.add('flipped', 'shake');
                setTimeout(() => { currentIndex++; updateUI(); }, 2000);
            }
        }

        function triggerCombo() {
            const p = document.getElementById('combo-popup');
            p.innerText = currentStreak >= 10 ? "ON FIRE! 🔥" : "COMBO! ⚡";
            p.style.display = "block";
            p.style.animation = "slideUp 0.5s ease-out forwards";
            setTimeout(() => { p.style.display = "none"; }, 800);
        }

        function showGameOver() {
            clearInterval(timerInterval);
            document.getElementById('progress-bar-fill').style.width = "100%";
            showScreen('screen-over');
            
            const statsArea = document.getElementById('extra-stats');
            const accuracy = currentDeck.length > 0 ? Math.round((score / currentDeck.length) * 100) : 0;

            if (isReviewMode) {
                document.getElementById('over-title').innerText = "Practice Done!";
                document.getElementById('final-stats').innerText = "Mistakes cleared.";
                document.getElementById('retry-missed-btn').style.display = 'none';
                statsArea.innerHTML = `• Practice session completed. No leaderboard impact.`;
            } else {
                saveScore(score, currentDeck.length, gameMode);
                document.getElementById('over-title').innerText = "Session Ended";
                document.getElementById('final-stats').innerText = `Result: ${score} / ${currentDeck.length}`;
                document.getElementById('retry-missed-btn').style.display = missedCards.length > 0 ? 'block' : 'none';
                
                statsArea.innerHTML = `
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div><b>Accuracy:</b> ${accuracy}%</div>
                        <div><b>Missed:</b> ${missedCards.length}</div>
                        <div><b>Best Streak:</b> ${bestStreak}</div>
                        <div><b>Mode:</b> ${gameMode}</div>
                    </div>
                `;
            }
        }

        function replayMissed() {
            if(missedCards.length === 0) return;
            isReviewMode = true;
            currentDeck = [...missedCards];
            missedCards = [];
            currentIndex = 0; score = 0; currentStreak = 0;
            document.getElementById('score-label').innerText = "Practice Mode";
            document.getElementById('log-list').innerHTML = "";
            document.getElementById('score-text').innerText = "0";
            document.getElementById('streak-chip').style.display = 'none';
            showScreen('game-ui');
            updateUI();
        }

        /**
         * LEADERBOARD UI
         */
        function toggleAnswer(el) {
            const p = el.parentElement;
            const open = p.classList.contains('open');
            document.querySelectorAll('.log-item').forEach(i => i.classList.remove('open'));
            if (!open) p.classList.add('open');
        }

        function resetLeaderboard() {
            if(confirm("Wipe all local records?")) {
                localStorage.removeItem('flashScores');
                updateLeaderboard();
            }
        }

        function updateLeaderboard() {
            let scores = [];
            try {
                const stored = localStorage.getItem('flashScores');
                scores = stored ? JSON.parse(stored) : [];
            } catch(e) { scores = []; }

            const content = document.getElementById('lb-content');
            content.innerHTML = scores.length ? '' : '<div style="font-size:0.7rem; opacity:0.4;">No records yet.</div>';
            
            scores.sort((a,b) => (b.score/b.total) - (a.score/a.total)).slice(0, 5).forEach(s => {
                const perc = s.total > 0 ? (s.score/s.total)*100 : 0;
                content.innerHTML += `
                    <div class="lb-entry">
                        <div class="lb-bar" style="width: ${perc}%"></div>
                        <div style="z-index:1; font-weight:bold;">${s.name}</div>
                        <div style="z-index:1; opacity:0.7; font-size:0.6rem;">${s.mode}</div>
                        <div style="z-index:1; color:var(--warning); font-weight:900;">${s.score}/${s.total}</div>
                    </div>`;
            });
        }

        function saveScore(s, t, m) {
            let scores = [];
            try {
                const stored = localStorage.getItem('flashScores');
                scores = stored ? JSON.parse(stored) : [];
            } catch(e) { scores = []; }

            scores.push({name: userName, score: s, total: t, mode: m});
            localStorage.setItem('flashScores', JSON.stringify(scores));
            updateLeaderboard();
        }
    </script>
</body>
</html>
